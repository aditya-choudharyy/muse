<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>MUSE — a home for messy minds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#17151b;
  --bg-soft:#1c1922;
  --panel:#201d26;
  --panel-2:#262230;
  --line:#37323f;
  --text:#ECE7DE;
  --text-dim:#9C93A3;
  --accent:#C9A15C;
  --accent-soft:#3a3122;
  --accent-2:#5FA8A0;
  --danger:#D06A5B;
  --shadow:rgba(0,0,0,0.5);
  --dot:rgba(255,255,255,0.06);
  --canvas-bg:#141218;
  --handle:#ECE7DE;
  --scrollbar:#37323f;
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:16px;
  --sbw:264px;           /* sidebar width; narrower on phones (see the media query at the end) */
  --serif:'Fraunces', Georgia, serif;
  --sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:'IBM Plex Mono', monospace;
  color-scheme: dark;
}
body[data-theme="light"]{
  --bg:#FFFFFF;
  --bg-soft:#F5F5F7;
  --panel:#FFFFFF;
  --panel-2:#EFEFF3;
  --line:#E0E0E7;
  --text:#1C1C21;
  --text-dim:#70707C;
  --accent:#8C5E2A;
  --accent-soft:#F6EEE2;
  --accent-2:#2E6E67;
  --danger:#C0392B;
  --shadow:rgba(20,20,35,0.12);
  --dot:rgba(20,20,35,0.14);
  --canvas-bg:#FFFFFF;
  --handle:#FFFFFF;
  --scrollbar:#D7D7DE;
  color-scheme: light;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0; overscroll-behavior:none; -webkit-tap-highlight-color:transparent;}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background .35s ease, color .35s ease;
}
body[data-theme="light"]{
  background-image:none;
}
::selection{background:var(--accent); color:var(--bg);}
button{font-family:var(--sans); cursor:pointer;}
input,textarea{font-family:var(--sans);}

::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--scrollbar); border-radius:8px;}

/* ============ APP SHELL ============ */
/* Pinned to the visible viewport. height:100vh on a phone is the height with the
   browser's address bar tucked away, so the bottom toolbar ended up underneath it. */
#app{display:flex; position:fixed; inset:0; overflow:hidden;}

/* ============ SIDEBAR ============ */
#sidebar{
  width:var(--sbw); min-width:var(--sbw); height:100%;
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  overflow:hidden;
  transition:width .28s cubic-bezier(.4,0,.2,1), min-width .28s cubic-bezier(.4,0,.2,1);
  position:relative; z-index:20;
}
#sidebar.collapsed{width:0; min-width:0; border-right:none;}
#sidebar-inner{width:var(--sbw); min-width:var(--sbw); height:100%; display:flex; flex-direction:column; overflow:hidden;}

.brand{
  padding:22px 20px 14px 20px;
  display:flex; align-items:baseline; gap:8px;
}
.brand-mark{font-family:var(--serif); font-weight:600; font-size:22px; letter-spacing:.01em; color:var(--text);}
.brand-tag{font-size:11px; color:var(--text-dim); font-family:var(--sans);}

.side-search{padding:0 16px 12px 16px;}
.side-search input{
  width:100%; padding:9px 12px; border-radius:var(--radius-s);
  border:1px solid var(--line); background:var(--bg-soft); color:var(--text);
  font-size:13px; outline:none;
}
.side-search input::placeholder{color:var(--text-dim);}
.side-search input:focus{border-color:var(--accent);}

.side-add{
  margin:0 16px 14px 16px;
  display:flex; align-items:center; justify-content:center; gap:7px;
  padding:9px 10px; border-radius:var(--radius-s);
  border:1px dashed var(--line); background:transparent; color:var(--text-dim);
  font-size:13px; transition:all .15s ease;
}
.side-add:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}

.project-list{flex:1; overflow-y:auto; padding:2px 10px 14px 10px;}
.project-item{
  display:flex; align-items:center; gap:8px;
  padding:9px 10px; border-radius:var(--radius-s);
  margin-bottom:2px; cursor:pointer; position:relative;
  border:1px solid transparent;
}
.project-item:hover{background:var(--bg-soft);}
.project-item.active{background:var(--accent-soft); border-color:var(--accent);}
.project-item .dot{width:6px; height:6px; border-radius:50%; background:var(--text-dim); flex:none;}
.project-item.active .dot{background:var(--accent);}
.project-item .name{
  flex:1; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  outline:none; padding:2px 0;
}
.project-item .name[contenteditable="true"]{
  text-overflow:clip; background:var(--bg); border-radius:4px; padding:2px 4px; cursor:text;
}
.project-item .row-btns{display:none; gap:4px; flex:none;}
.project-item:hover .row-btns{display:flex;}
.icon-btn{
  width:22px; height:22px; display:flex; align-items:center; justify-content:center;
  border-radius:5px; border:none; background:transparent; color:var(--text-dim);
}
.icon-btn:hover{background:var(--panel-2); color:var(--text);}
.icon-btn svg{width:13px; height:13px;}
.empty-hint{padding:20px 16px; font-size:12.5px; color:var(--text-dim); line-height:1.5;}

.side-footer{
  padding:12px 16px 16px 16px; border-top:1px solid var(--line);
  font-size:11px; color:var(--text-dim); line-height:1.5;
}

/* collapse tab */
#sidebar-toggle{
  position:absolute; top:16px; left:var(--sbw); transform:translateX(-50%);
  width:30px; height:30px; border-radius:50%;
  background:var(--panel); border:1px solid var(--line); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center;
  z-index:30;
  transition:left .28s cubic-bezier(.4,0,.2,1), transform .28s cubic-bezier(.4,0,.2,1),
             width .28s ease, height .28s ease, border-radius .28s ease;
  box-shadow:0 2px 6px var(--shadow);
}
/* invisible padding so the cursor doesn't have to be pixel-accurate */
#sidebar-toggle::before{content:''; position:absolute; inset:-10px; border-radius:50%;}
#sidebar-toggle:hover{color:var(--accent); border-color:var(--accent); background:var(--panel-2);}
/* when collapsed: sit fully on-canvas as a wider pill, never half off-screen */
#sidebar.collapsed ~ #sidebar-toggle{
  left:14px; transform:translateX(0);
  width:38px; height:34px; border-radius:10px;
}
#sidebar.collapsed ~ #sidebar-toggle::before{inset:-14px; border-radius:16px;}
#sidebar-toggle svg{width:14px; height:14px; transition:transform .28s ease;}
#sidebar.collapsed ~ #sidebar-toggle svg{transform:rotate(180deg);}

/* ============ MAIN / CANVAS ============ */
#main{flex:1; position:relative; overflow:hidden; background:var(--canvas-bg);}
#stage{
  position:absolute; inset:0; overflow:hidden; touch-action:none; cursor:default;
}
#stage.panning{cursor:grabbing;}
#stage.pan-ready{cursor:grab;}
#stage.draw-mode{cursor:crosshair;}
#stage.connect-mode{cursor:crosshair;}
#stage.text-mode{cursor:crosshair;}
/* the rubber band while you draw a text box */
#marquee.text-draw{border-style:dashed; border-color:var(--accent); background:rgba(201,161,92,0.10);}
/* while sketching / dragging / resizing, never let the browser start a text selection */
#stage.draw-mode, #stage.draw-mode *{
  user-select:none; -webkit-user-select:none; -ms-user-select:none;
}
body.gesture-active, body.gesture-active *{
  user-select:none !important; -webkit-user-select:none !important;
}
body.gesture-active [contenteditable="true"]{user-select:text !important; -webkit-user-select:text !important;}
#world{
  position:absolute; top:0; left:0; width:1px; height:1px; transform-origin:0 0;
  background-image: radial-gradient(var(--dot) 1.4px, transparent 1.4px);
  background-size: 28px 28px;
}
#world-inner-bg{position:absolute; width:9000px; height:9000px; left:-4500px; top:-4500px;
  background-image: radial-gradient(var(--dot) 1.4px, transparent 1.4px);
  background-size: 28px 28px;
}

#connector-svg{position:absolute; left:-4500px; top:-4500px; width:9000px; height:9000px; overflow:visible; pointer-events:none;}
/* live sketch stroke draws here, ABOVE every element, so it never appears "behind" an image */
#sketch-overlay{
  position:absolute; left:-4500px; top:-4500px; width:9000px; height:9000px;
  overflow:visible; pointer-events:none; z-index:999999;
}
.connector-line{stroke:var(--accent-2); stroke-width:2; fill:none; opacity:.85;}
.connector-hit{stroke:transparent; stroke-width:14; fill:none; pointer-events:stroke; cursor:pointer;}
.connector-hit:hover + .connector-line, .connector-line.hovered{stroke:var(--danger);}

/* canvas title / project name */
#canvas-topbar{
  position:absolute; top:16px; left:16px; z-index:15;
  display:flex; align-items:center; gap:10px;
  pointer-events:none;
}
#canvas-topbar{transition:left .28s cubic-bezier(.4,0,.2,1);}
/* make room for the collapsed toggle pill so it never sits on the title */
#sidebar.collapsed ~ #main #canvas-topbar{left:66px;}
#project-title{
  pointer-events:auto;
  font-family:var(--serif); font-size:18px; font-weight:500; color:var(--text);
  background:transparent; border:none; outline:none; max-width:40vw;
  padding:4px 6px; border-radius:6px;
}
#project-title:hover{background:var(--panel);}
#project-title:focus{background:var(--panel); box-shadow:0 0 0 1px var(--accent);}
#save-indicator{
  pointer-events:auto; font-size:11px; color:var(--text-dim); font-family:var(--mono);
  opacity:0; transition:opacity .4s ease;
}
#save-indicator.show{opacity:1;}

/* empty state */
#empty-state{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  text-align:center; color:var(--text-dim); pointer-events:none; z-index:2;
  max-width:360px;
}
#empty-state h2{font-family:var(--serif); font-weight:500; font-size:22px; color:var(--text); margin:0 0 8px 0;}
#empty-state p{font-size:13px; line-height:1.6; margin:0;}

/* theme toggle */
#theme-toggle{
  position:absolute; top:16px; right:20px; z-index:25;
  width:38px; height:38px; border-radius:50%;
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 8px var(--shadow);
}
#theme-toggle:hover{border-color:var(--accent); color:var(--accent);}
#theme-toggle svg{width:17px; height:17px;}
#theme-toggle .moon{display:none;}
body[data-theme="light"] #theme-toggle .sun{display:none;}
body[data-theme="light"] #theme-toggle .moon{display:block;}

/* undo/redo */
#history-controls{
  position:absolute; top:16px; right:68px; z-index:25;
  display:flex; align-items:center; gap:2px;
  background:var(--panel); border:1px solid var(--line); border-radius:999px;
  box-shadow:0 2px 8px var(--shadow); padding:3px;
}
#history-controls button{
  width:32px; height:32px; border-radius:50%; border:none; background:transparent; color:var(--text-dim);
  display:flex; align-items:center; justify-content:center;
}
#history-controls button svg{width:15px; height:15px;}
#history-controls button:hover{background:var(--panel-2); color:var(--text);}
#history-controls button:disabled{opacity:.35; pointer-events:none;}

/* sketch color popover
   (the old #sketch-colors{display:none} rule out-specified .sketch-colors{display:flex},
   so removing .hidden never revealed the palette — it could never be opened at all) */
.tb-btn.active#sketch-tool .tt{display:none;}

/* zoom controls */
#zoom-controls{
  position:absolute; bottom:20px; right:20px; z-index:25;
  display:flex; align-items:center; gap:2px;
  background:var(--panel); border:1px solid var(--line); border-radius:999px;
  box-shadow:0 4px 14px var(--shadow); padding:4px;
}
#zoom-controls button{
  width:30px; height:30px; border-radius:50%; border:none; background:transparent; color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; font-size:15px;
}
#zoom-controls button:hover{background:var(--panel-2); color:var(--text);}
#zoom-pct{
  font-family:var(--mono); font-size:11px; color:var(--text-dim); width:42px; text-align:center;
  cursor:pointer; border-radius:6px; padding:4px 0; user-select:none;
}
#zoom-pct:hover{color:var(--accent); background:var(--panel-2);}

/* floating toolbar */
#toolbar{
  position:absolute; bottom:22px; left:50%; transform:translateX(-50%); z-index:25;
  display:flex; align-items:center; gap:3px;
  background:var(--panel); border:1px solid var(--line); border-radius:999px;
  box-shadow:0 8px 24px var(--shadow); padding:6px;
}
.tb-btn{
  width:40px; height:40px; border-radius:50%; border:none; background:transparent; color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; position:relative;
}
.tb-btn svg{width:18px; height:18px;}
.tb-btn:hover{background:var(--panel-2); color:var(--text);}
.tb-btn.active{background:var(--accent); color:var(--bg);}
.tb-sep{width:1px; height:22px; background:var(--line); margin:0 4px;}
.tb-btn .tt{
  position:absolute; bottom:48px; left:50%; transform:translateX(-50%);
  background:var(--bg); color:var(--text); font-size:11px; padding:4px 8px; border-radius:5px;
  white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .15s ease; border:1px solid var(--line);
}
.tb-btn:hover .tt{opacity:1;}
.tb-btn:disabled{opacity:.35; pointer-events:none;}

/* now a row inside #sketch-panel rather than a popover of its own */
.sketch-colors{display:flex; gap:6px;}
.sketch-colors button{width:19px; height:19px; border-radius:50%; border:2px solid transparent; padding:0; flex:none;}
.sketch-colors button:hover{transform:scale(1.12);}
.sketch-colors button.active{border-color:var(--text);}

/* ============ ELEMENTS ============ */
.el{
  position:absolute; will-change:transform;
}
.el-frame{
  width:100%; height:100%; position:relative; border-radius:4px;
  outline:2px solid transparent; outline-offset:3px;
}
.el.selected .el-frame{outline-color:var(--accent-2);}
.el.selected .el-frame::after{
  content:''; position:absolute; inset:-3px; border-radius:6px; pointer-events:none;
}

/* The chrome layer: toolbar, lock badge and any open panel live here.
   It spans the frame and is counter-rotated by exactly the element's own
   angle, so a rotated card keeps its controls upright and where you left
   them instead of spinning them out of reach. */
.el-chrome{
  position:absolute; inset:0; pointer-events:none; z-index:66;
  transform-origin:50% 50%;
}
.el-chrome > *{pointer-events:auto;}

.el-toolbar{
  position:absolute; top:-38px; left:0; display:none; gap:2px;
  background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:3px;
  box-shadow:0 4px 10px var(--shadow); white-space:nowrap;
}
.el.selected .el-toolbar{display:flex;}
/* near the top of the screen the bar would sit under the project title row,
   where it can't be clicked, so it moves below the element instead */
.el.tb-below .el-toolbar{top:calc(100% + 10px);}
.el.tb-below .adjust-pop{top:calc(100% + 56px);}
.el-toolbar button{
  width:26px; height:26px; border:none; background:transparent; color:var(--text-dim); border-radius:5px;
  display:flex; align-items:center; justify-content:center;
}
.el-toolbar button:hover{background:var(--panel-2); color:var(--text);}
.el-toolbar button svg{width:13px; height:13px;}
.el-toolbar button.danger:hover{color:var(--danger);}

.resize-handle{
  position:absolute; width:14px; height:14px; background:var(--handle); border:2px solid var(--accent-2);
  border-radius:50%; z-index:50; display:none;
}
.el.selected .resize-handle{display:block;}
.rh-nw{top:-6px; left:-6px; cursor:nwse-resize;}
.rh-ne{top:-6px; right:-6px; cursor:nesw-resize;}
.rh-sw{bottom:-6px; left:-6px; cursor:nesw-resize;}
.rh-se{bottom:-6px; right:-6px; cursor:nwse-resize;}

.el-image img{width:100%; height:100%; object-fit:contain; display:block; border-radius:4px; pointer-events:none; user-select:none; -webkit-user-drag:none; user-drag:none;}
/* No fill behind the picture. A solid panel here meant that fading an image
   revealed the panel colour rather than whatever sits underneath it. */
.el-image .el-frame{background:transparent; border-radius:4px;}
/* a faded image still has to be grabbable, so the frame keeps its own hit area */
.el-image .el-frame::before{content:''; position:absolute; inset:0; border-radius:4px;}

/* ---- reference guides drawn over the image ---- */
.img-grid{position:absolute; pointer-events:none; z-index:2; --gl:rgba(255,255,255,.58);}
.img-grid[data-mode="thirds"]{
  background-image:
    linear-gradient(90deg, transparent 0 calc(33.333% - .5px), var(--gl) calc(33.333% - .5px) calc(33.333% + .5px), transparent calc(33.333% + .5px) calc(66.667% - .5px), var(--gl) calc(66.667% - .5px) calc(66.667% + .5px), transparent calc(66.667% + .5px)),
    linear-gradient(0deg, transparent 0 calc(33.333% - .5px), var(--gl) calc(33.333% - .5px) calc(33.333% + .5px), transparent calc(33.333% + .5px) calc(66.667% - .5px), var(--gl) calc(66.667% - .5px) calc(66.667% + .5px), transparent calc(66.667% + .5px));
}
.img-grid[data-mode="grid"]{
  background-image:
    repeating-linear-gradient(90deg, var(--gl) 0 1px, transparent 1px 25%),
    repeating-linear-gradient(0deg, var(--gl) 0 1px, transparent 1px 25%);
}
.img-grid[data-mode="cross"]{
  background-image:
    linear-gradient(90deg, transparent 0 calc(50% - .5px), var(--gl) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)),
    linear-gradient(0deg, transparent 0 calc(50% - .5px), var(--gl) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px));
}

/* ---- adjust popover ---- */
.adjust-pop{
  position:absolute; top:calc(100% + 12px); left:0; z-index:66;
  width:216px; background:var(--panel); border:1px solid var(--line);
  border-radius:10px; padding:11px; box-shadow:0 10px 26px var(--shadow);
  display:flex; flex-direction:column; gap:10px;
  font-size:11.5px; color:var(--text-dim);
}
.ap-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.ap-label{flex:none;}
.ap-seg{display:flex; gap:3px; background:var(--bg-soft); border-radius:7px; padding:2px;}
.ap-seg button{
  border:none; background:transparent; color:var(--text-dim);
  font-size:10.5px; padding:4px 7px; border-radius:5px; white-space:nowrap;
}
.ap-seg button:hover{color:var(--text);}
.ap-seg button.on{background:var(--accent); color:var(--bg); font-weight:600;}
.ap-op{flex:1; accent-color:var(--accent); height:3px; min-width:0;}
.ap-val{font-family:var(--mono); font-size:10px; width:30px; text-align:right; flex:none;}
.ap-palette{
  border:1px dashed var(--line); background:transparent; color:var(--text-dim);
  padding:7px; border-radius:7px; font-size:11.5px; width:100%;
}
.ap-palette:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}

/* ---- rotate popover ---- */
.rot-pop{width:196px;}
.rot-pop .ap-seg button{font-size:13px; padding:4px 9px;}
.ap-rot{flex:1; accent-color:var(--accent); height:3px; min-width:0;}

/* ---- locked elements ---- */
.el.locked > .el-frame > .resize-handle{display:none !important;}
.el.locked.selected .el-frame{outline-color:var(--accent);}
/* a lock that's on has to look on */
.el-toolbar button.lock-btn.on{background:var(--accent); color:var(--bg);}
.el-toolbar button.lock-btn.on:hover{background:var(--accent); color:var(--bg); filter:brightness(1.08);}
.lock-badge{
  position:absolute; top:-9px; left:-9px; z-index:51;
  width:19px; height:19px; border-radius:50%;
  background:var(--accent); color:var(--bg);
  display:none; align-items:center; justify-content:center;
  box-shadow:0 2px 5px var(--shadow);
}
.el.locked .lock-badge{display:flex;}
.lock-badge svg{width:10px; height:10px;}

.el-text .txt{
  width:100%; height:100%; outline:none; overflow:hidden; word-break:break-word;
  padding:6px 8px; line-height:1.35; color:var(--el-color, var(--text));
  font-family:var(--serif); background:transparent;
}
.el-text.editing .txt{cursor:text; background:var(--panel);}
.el-text .el-frame{background:var(--el-bg, transparent); border-radius:6px;}

.el-youtube .yt-wrap{position:absolute; inset:0; border-radius:6px; overflow:hidden; background:#000;}
.el-youtube iframe{width:100%; height:100%; border:0; display:block;}

/* poster facade: shown until the viewer hits play. Keeps the card tappable. */
.yt-poster{
  position:absolute; inset:0; background:#000 center/cover no-repeat;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.yt-poster::after{content:''; position:absolute; inset:0; background:rgba(0,0,0,0.18);}
.yt-play{
  position:relative; z-index:2; width:62px; height:44px; border:none; background:transparent; padding:0;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); transition:transform .15s ease, opacity .15s ease;
  opacity:.92;
}
.yt-play svg{width:100%; height:100%; display:block;}
.yt-poster:hover .yt-play{transform:scale(1.08); opacity:1;}

/* shield sits over a live iframe whenever the card is NOT selected, so one tap
   selects the card and the next tap reaches the player */
.el-youtube .yt-shield{position:absolute; inset:0; z-index:3; display:block; cursor:pointer;}
.el-youtube.selected .yt-shield{display:none;}
.el-youtube.dragging .yt-shield, .el-youtube.resizing .yt-shield{display:block;}
/* keep the shield up in sketch / connect mode so a stroke can cross an embed */
body.tool-sketch .el-youtube .yt-shield,
body.tool-connect .el-youtube .yt-shield{display:block !important;}
body.tool-sketch .el-youtube .yt-shield{cursor:crosshair;}

/* drag strip: how you move a selected, playing card without fighting the player */
.yt-grip{
  position:absolute; top:0; left:0; right:0; height:22px; z-index:4; display:none;
  cursor:grab; background:linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,0));
  align-items:center; justify-content:center;
}
.el-youtube.selected.playing .yt-grip{display:flex;}
.yt-grip::after{
  content:''; width:34px; height:3px; border-radius:2px; background:rgba(255,255,255,.55);
}
.yt-open{
  position:absolute; bottom:6px; right:6px; z-index:4; display:none;
  align-items:center; gap:4px; font-size:11px; color:#fff; text-decoration:none;
  background:rgba(10,10,14,0.66); border-radius:6px; padding:4px 7px; backdrop-filter:blur(4px);
}
.el-youtube.selected .yt-open{display:flex;}
.yt-open:hover{background:rgba(10,10,14,0.85);}
.yt-open svg{width:11px; height:11px;}

.el-video video{width:100%; height:100%; object-fit:contain; display:block; border-radius:6px; background:#000; -webkit-user-drag:none; user-drag:none;}
.vid-shield{position:absolute; inset:0; z-index:2; display:none;}
.el-video.dragging .vid-shield, .el-video.resizing .vid-shield{display:block;}
.vid-controls{
  position:absolute; left:8px; right:8px; bottom:8px; z-index:3;
  display:flex; align-items:center; gap:10px;
  background:rgba(12,12,18,0.72); backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.13);
  border-radius:12px; padding:8px 12px;
}
.vid-controls button{
  width:34px; height:34px; flex:none; border:none; border-radius:50%;
  background:rgba(255,255,255,0.13); color:#fff;
  display:flex; align-items:center; justify-content:center;
  transition:background .15s ease, transform .12s ease;
}
.vid-controls button:hover{background:rgba(255,255,255,0.26); transform:scale(1.06);}
.vid-controls button.play-btn{background:#fff; color:#111;}
.vid-controls button.play-btn:hover{background:#fff;}
.vid-controls svg{width:17px; height:17px;}
.vid-controls .vid-time{
  font-family:var(--mono); font-size:11px; color:#fff; opacity:.85; flex:none;
  min-width:78px; text-align:center; letter-spacing:.02em;
}
.vid-controls input[type="range"]{
  flex:1; min-width:0; accent-color:#fff; height:5px; cursor:pointer;
}
/* the volume slider only unrolls while the speaker is hovered or focused,
   so at rest the bar is two unmistakable round buttons and one long seek bar */
.vid-vol-wrap{display:flex; align-items:center; gap:6px; flex:none;}
.vid-controls .vol{
  width:0; opacity:0; flex:none; transition:width .18s ease, opacity .18s ease;
  pointer-events:none;
}
.vid-vol-wrap:hover .vol, .vid-vol-wrap:focus-within .vol{width:66px; opacity:1; pointer-events:auto;}
/* a small card can't fit the full bar; drop the timecode first, then the volume */
.el-video[data-compact="1"] .vid-time{display:none;}
.el-video[data-compact="2"] .vid-time{display:none;}
.el-video[data-compact="2"] .vid-vol-wrap{display:none;}
.el-video[data-compact="2"] .vid-controls{gap:8px; padding:6px 8px;}

.el-sketch svg{width:100%; height:100%; display:block; pointer-events:none;}
/* The eraser works on geometry now, not on hit-testing, so the ink stays
   click-through and a stroke can be rubbed out even under an image. */
#stage.erase-mode{cursor:none;}
#eraser-ring{
  position:fixed; z-index:99999; border-radius:50%; pointer-events:none; display:none;
  border:1.5px solid var(--accent); background:rgba(228,102,75,.10);
  transform:translate(-50%,-50%);
}
#eraser-ring.show{display:block;}

/* ---- sticky notes ---- */
.el-text.has-bg .txt{padding:13px 15px; color:var(--el-bg-ink, var(--el-color, var(--text)));}
.el-text.has-bg .el-frame{box-shadow:0 4px 14px var(--shadow);}
.text-pop{width:198px;}
.tp-swatches{display:flex; gap:5px; flex-wrap:wrap;}
.tp-swatches button{width:19px; height:19px; border-radius:50%; border:2px solid transparent; padding:0;}
.tp-swatches button.on{border-color:var(--text);}
.tp-swatches button.none{background:transparent; border:1px dashed var(--line); color:var(--text-dim); font-size:9px; line-height:1;}

/* ---- colour palette strip ---- */
.el-palette .el-frame{background:var(--panel); border:1px solid var(--line); border-radius:9px; overflow:hidden;}
/* A grab bar across the top: the swatches used to fill the whole card and
   swallow every press, leaving a 3px border as the only way to move it. */
.pal-grip{
  position:absolute; top:0; left:0; right:0; height:20px; z-index:2;
  display:flex; align-items:center; justify-content:center; gap:5px;
  cursor:grab; background:var(--panel-2); border-bottom:1px solid var(--line);
}
.pal-grip::after{content:''; width:30px; height:3px; border-radius:2px; background:var(--text-dim); opacity:.55;}
.pal-grip:hover::after{opacity:.9;}
.pal-strip{position:absolute; left:3px; right:3px; top:23px; bottom:3px; display:flex; border-radius:6px; overflow:hidden;}
.pal-sw{flex:1; display:flex; align-items:flex-end; justify-content:center; cursor:copy;}
.pal-sw span{
  font-family:var(--mono); font-size:9px; padding:0 0 5px 0; opacity:0;
  transition:opacity .15s ease; text-shadow:0 1px 3px rgba(0,0,0,.65); color:#fff;
}
.pal-sw:hover span{opacity:1;}

/* ---- voice note ---- */
.el-audio .el-frame{background:var(--panel); border:1px solid var(--line); border-radius:11px;}
.aud-ui{position:absolute; inset:0; display:flex; align-items:center; gap:11px; padding:0 13px;}
.aud-play{width:34px; height:34px; border-radius:50%; border:none; background:var(--accent); color:var(--bg); display:flex; align-items:center; justify-content:center; flex:none;}
.aud-play svg{width:15px; height:15px;}
.aud-mid{flex:1; min-width:0;}
.aud-label{font-size:11.5px; color:var(--text-dim); margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; outline:none;}
.aud-row{display:flex; align-items:center; gap:8px;}
.aud-seek{flex:1; accent-color:var(--accent-2); height:4px; min-width:0; cursor:pointer;}
.aud-time{font-family:var(--mono); font-size:10px; color:var(--text-dim); flex:none;}
/* volume: a speaker button that unrolls its slider on hover, the same way
   the video bar works, so a narrow card isn't crowded at rest */
.aud-vol-wrap{display:flex; align-items:center; gap:6px; flex:none;}
.aud-mute{
  width:28px; height:28px; flex:none; border:none; border-radius:50%;
  background:var(--panel-2); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center;
  transition:background .15s ease, color .15s ease;
}
.aud-mute:hover{background:var(--accent-soft); color:var(--accent);}
.aud-mute svg{width:14px; height:14px;}
.aud-vol{
  width:0; opacity:0; flex:none; accent-color:var(--accent); height:4px;
  transition:width .18s ease, opacity .18s ease; pointer-events:none; cursor:pointer;
}
.aud-vol-wrap:hover .aud-vol, .aud-vol-wrap:focus-within .aud-vol,
.el-audio[data-wide="1"] .aud-vol{width:58px; opacity:1; pointer-events:auto;}
/* on a narrow card the countdown goes before the volume does */
.el-audio[data-narrow="1"] .aud-time{display:none;}

/* ---- named sections ----
   The body of a section is click-through, so it can sit under a pile of
   references without swallowing every press. You move it by its title tab. */
.el-section{pointer-events:none;}
.el-section .el-frame{border:1.5px dashed var(--line); border-radius:12px; background:transparent;}
.el-section.selected .el-frame{border-color:var(--accent-2);}
.el-section .el-toolbar,
.el-section .resize-handle,
.el-section .lock-badge,
.el-section .adjust-pop,
.el-section .el-chrome > *,
.el-section .section-edge,
.el-section .tag-stripe{pointer-events:auto;}

/* The four edge bands. A section can be buried under everything it holds,
   and its one title tab with it, so every side of the dashed border is a
   grab handle as well. */
.section-edge{
  position:absolute; z-index:3; cursor:move; background:transparent;
}
.section-edge.se-t{top:-11px; left:0; right:0; height:24px;}
.section-edge.se-b{bottom:-11px; left:0; right:0; height:24px;}
.section-edge.se-l{left:-11px; top:0; bottom:0; width:24px;}
.section-edge.se-r{right:-11px; top:0; bottom:0; width:24px;}
.section-edge:hover{background:rgba(95,168,160,0.16);}
/* a selected section can also be dragged from any empty spot inside it */
#stage.section-move{cursor:move;}
/* A selected section floats to the top so its border, title and edges are
   reachable even when it sits under a stack of references. It drops back
   the moment you select something else. */
.el-section.selected{z-index:999990 !important;}
/* The title sits INSIDE the frame. Above it, it covered the element toolbar
   and swallowed every click meant for the tag and lock buttons. */
/* The tab is purely a grab handle now: bigger, with a grip mark, and a
   generous invisible margin so you don't have to be accurate with it. */
.section-title{
  position:absolute; top:10px; left:12px; pointer-events:auto; cursor:grab;
  display:flex; align-items:center; gap:8px;
  font-family:var(--serif); font-size:14px; color:var(--text-dim);
  padding:7px 14px; border-radius:9px; min-height:32px;
  background:var(--panel); border:1px solid var(--line);
  box-shadow:0 2px 8px var(--shadow);
  max-width:calc(100% - 24px); white-space:nowrap; outline:none;
  transition:color .15s ease, border-color .15s ease, background .15s ease;
}
.section-title::before{content:''; position:absolute; inset:-10px; border-radius:16px;}
.section-title:active{cursor:grabbing;}
.st-grip{width:10px; height:16px; flex:none; opacity:.6; display:block;}
.st-grip svg{width:10px; height:16px; display:block; fill:currentColor;}
.st-text{overflow:hidden; text-overflow:ellipsis; outline:none; min-width:14px;}
.section-title:hover{color:var(--text); border-color:var(--accent-2); background:var(--panel-2);}
.section-title:hover .st-grip{opacity:.95;}
.el-section.selected .section-title{color:var(--text); border-color:var(--accent-2);}
.section-title.renaming{cursor:text; background:var(--bg);}
.section-title.renaming .st-grip{display:none;}
.st-text[contenteditable="true"]{cursor:text; color:var(--text);}

/* ---- tags ---- */
/* A dot in a corner was indistinguishable from a resize handle, so tagging
   looked like it did nothing. A stripe down the left edge can't be confused
   with anything else, and it stays put while the element resizes. */
.tag-stripe{
  position:absolute; left:-9px; top:10%; bottom:10%; width:5px; border-radius:3px;
  display:none; z-index:52; box-shadow:0 0 0 1.5px var(--canvas-bg);
}
.el.tagged .tag-stripe{display:block;}
.el.dimmed{opacity:.14; pointer-events:none;}
#tag-filter{display:flex; gap:6px; align-items:center; pointer-events:auto;}
#tag-filter .tf-label{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-dim);}
#tag-filter button{width:16px; height:16px; border-radius:50%; border:2px solid transparent; padding:0;}
#tag-filter button:hover{border-color:var(--text-dim);}
#tag-filter button.on{border-color:var(--text);}
#tag-filter .tf-clear{
  width:auto; height:auto; border:none; background:transparent; color:var(--text-dim);
  font-size:11px; padding:2px 5px; border-radius:4px;
}
#tag-filter .tf-clear:hover{color:var(--accent);}

/* ---- alignment guides ----
   computeSnap/drawGuides existed but had nowhere to draw: there was no
   #guide-layer in the document, so guideLayer was always null. */
#guide-layer{
  position:absolute; left:-4500px; top:-4500px; width:9000px; height:9000px;
  overflow:visible; pointer-events:none; z-index:999998;
}
.guide-line{stroke:var(--accent); stroke-width:1; stroke-dasharray:5 4; opacity:.9; vector-effect:non-scaling-stroke;}

/* ---- sketch panel ---- */
.sketch-panel{
  position:absolute; bottom:82px; left:50%; transform:translateX(-50%); z-index:26;
  display:flex; align-items:center; gap:9px;
  background:var(--panel); border:1px solid var(--line); border-radius:999px;
  padding:6px 13px; box-shadow:0 8px 20px var(--shadow);
}
.sk-row{display:flex; align-items:center; gap:5px;}
.sk-sep{width:1px; height:20px; background:var(--line);}
.sk-modes button{
  width:28px; height:28px; border-radius:50%; border:none; background:transparent;
  color:var(--text-dim); display:flex; align-items:center; justify-content:center;
}
.sk-modes button svg{width:15px; height:15px;}
.sk-modes button:hover{background:var(--panel-2); color:var(--text);}
.sk-modes button.active{background:var(--accent); color:var(--bg);}
#sketch-width{width:74px; accent-color:var(--accent); height:3px;}
#sketch-width-val{font-family:var(--mono); font-size:10px; color:var(--text-dim); width:16px; text-align:right;}

/* ---- cross-board search results ---- */
.search-head{
  padding:14px 12px 6px 12px; font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--text-dim);
}
.hit-item{padding:8px 10px; border-radius:var(--radius-s); cursor:pointer; margin-bottom:2px;}
.hit-item:hover{background:var(--bg-soft);}
.hit-text{font-size:12.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.hit-where{font-size:10.5px; color:var(--text-dim); margin-top:2px;}

/* ---- recording chip ---- */
#rec-chip{
  position:absolute; bottom:84px; left:50%; transform:translateX(-50%); z-index:27;
  display:none; align-items:center; gap:10px;
  background:var(--panel); border:1px solid var(--danger); border-radius:999px;
  padding:7px 8px 7px 15px; box-shadow:0 6px 18px var(--shadow); font-size:12.5px; color:var(--text);
}
#rec-chip.show{display:flex;}
#rec-dot{width:9px; height:9px; border-radius:50%; background:var(--danger); animation:rec-pulse 1s infinite;}
@keyframes rec-pulse{0%,100%{opacity:1;} 50%{opacity:.2;}}
#rec-time{font-family:var(--mono); font-size:11px; color:var(--text-dim);}
#rec-stop{border:none; background:var(--danger); color:#fff; font-weight:600; font-size:11.5px; padding:5px 13px; border-radius:999px;}

/* ---- sidebar export / import ---- */
.side-io{display:flex; gap:6px; padding:0 16px 12px 16px;}
.side-io button{
  flex:1; padding:7px 4px; border-radius:var(--radius-s); border:1px solid var(--line);
  background:transparent; color:var(--text-dim); font-size:11px; white-space:nowrap;
  transition:border-color .15s ease, color .15s ease, background .15s ease;
}
.side-io button:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}

/* marquee */
#marquee{
  position:absolute; border:1px solid var(--accent-2); background:rgba(95,168,160,0.12);
  z-index:50; display:none; pointer-events:none;
}

/* group bounding box */
#group-box{
  position:absolute; border:1.5px dashed var(--accent-2); display:none; z-index:6; pointer-events:none;
}
#group-box .resize-handle{display:block; pointer-events:auto;}

/* crop / annotate overlay */
.tool-overlay{position:absolute; inset:0; z-index:60; background:rgba(0,0,0,0.35); border-radius:4px;}
.crop-rect{
  position:absolute; border:1.5px dashed #fff; box-shadow:0 0 0 2000px rgba(0,0,0,.45);
  cursor:move;
}
/* crop handles are bigger than the element's own, and are the ONLY handles on screen
   while cropping (the element's own are hidden via .el.tool-active below) */
.crop-rect .resize-handle{
  display:block; background:#fff; border-color:var(--accent-2);
  width:18px; height:18px; border-width:3px;
}
.crop-rect .rh-nw{top:-9px; left:-9px;}
.crop-rect .rh-ne{top:-9px; right:-9px;}
.crop-rect .rh-sw{bottom:-9px; left:-9px;}
.crop-rect .rh-se{bottom:-9px; right:-9px;}
/* generous invisible grab area around each crop handle */
.crop-rect .resize-handle::before{content:''; position:absolute; inset:-9px;}

/* while a crop/annotate overlay is open, the element's own resize handles and
   toolbar are hidden so they can't be grabbed by mistake */
/* crop and annotate work in straight screen coordinates, so a rotated card
   is stood upright for the duration and put back afterwards */
.el.tool-active{transform:none !important;}
.el.tool-active > .el-frame > .resize-handle{display:none !important;}
.el.tool-active .el-chrome{display:none !important;}
.el.tool-active .el-frame{outline-color:transparent !important;}

.tool-actions{
  position:absolute; bottom:-42px; left:50%; transform:translateX(-50%); z-index:64;
  display:flex; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:5px; box-shadow:0 4px 10px var(--shadow);
}
.tool-actions button{
  font-size:12px; padding:6px 12px; border-radius:6px; border:none; background:var(--panel-2); color:var(--text);
}
.tool-actions button.primary{background:var(--accent); color:var(--bg); font-weight:600;}
.annotate-canvas{position:absolute; inset:0; z-index:61; cursor:crosshair; border-radius:4px; touch-action:none;}
.annotate-colors{position:absolute; top:-42px; left:0; z-index:64; display:flex; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; box-shadow:0 4px 10px var(--shadow);}
.annotate-colors button{width:20px; height:20px; border-radius:50%; border:2px solid transparent;}
.annotate-colors button.active{border-color:var(--text);}

/* ============ OFF-SCREEN WAYFINDING ============ */
#offscreen-markers{position:absolute; inset:0; pointer-events:none; z-index:22;}
.om{
  position:absolute; width:30px; height:30px; margin:-15px 0 0 -15px;
  pointer-events:auto; cursor:pointer;
  animation:om-in .18s ease-out both;
}
@keyframes om-in{from{opacity:0; transform:scale(.6);} to{opacity:1; transform:scale(1);}}
.om-badge{
  position:absolute; inset:0; border-radius:50%;
  background:var(--panel); border:1px solid var(--line); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 8px var(--shadow);
  transition:transform .15s ease, color .15s ease, border-color .15s ease, background .15s ease;
}
.om:hover .om-badge{transform:scale(1.14); color:var(--accent); border-color:var(--accent); background:var(--panel-2);}
.om-badge svg{width:14px; height:14px;}
.om-ptr{
  position:absolute; left:50%; top:50%; width:13px; height:13px; margin:-6.5px 0 0 -6.5px;
  color:var(--accent); display:flex; align-items:center; justify-content:center;
  transition:color .15s ease;
}
.om-ptr svg{width:13px; height:13px;}
.om-count{
  position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; padding:0 4px;
  border-radius:9px; background:var(--accent); color:var(--bg);
  font-size:10px; font-weight:600; line-height:17px; text-align:center;
  font-family:var(--mono); box-shadow:0 1px 4px var(--shadow);
}
.om-label{
  position:absolute; background:var(--bg); border:1px solid var(--line); color:var(--text);
  font-size:11px; padding:4px 8px; border-radius:5px; white-space:nowrap;
  opacity:0; pointer-events:none; transition:opacity .15s ease;
  max-width:160px; overflow:hidden; text-overflow:ellipsis;
  box-shadow:0 3px 10px var(--shadow);
}
.om:hover .om-label{opacity:1;}
.om.side-l .om-label{left:38px; top:50%; transform:translateY(-50%);}
.om.side-r .om-label{right:38px; top:50%; transform:translateY(-50%);}
.om.side-t .om-label{top:38px; left:50%; transform:translateX(-50%);}
.om.side-b .om-label{bottom:38px; left:50%; transform:translateX(-50%);}

/* "you've drifted off the board" rescue chip */
#lost-chip{
  position:absolute; top:60px; left:50%; z-index:24;
  transform:translateX(-50%) translateY(-8px);
  display:flex; align-items:center; gap:10px;
  background:var(--panel); border:1px solid var(--line); border-radius:999px;
  padding:7px 8px 7px 15px; box-shadow:0 6px 18px var(--shadow);
  font-size:12.5px; color:var(--text-dim);
  opacity:0; pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
}
#lost-chip.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}
#lost-chip button{
  border:none; background:var(--accent); color:var(--bg); font-weight:600;
  font-size:11.5px; padding:5px 12px; border-radius:999px;
}
#lost-chip button:hover{filter:brightness(1.1);}
#lost-chip kbd{
  font-family:var(--mono); font-size:10px; border:1px solid var(--line);
  border-radius:4px; padding:1px 4px; color:var(--text-dim);
}

/* toast */
#toast{
  position:absolute; top:18px; left:50%; transform:translateX(-50%) translateY(-10px);
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  padding:9px 16px; border-radius:8px; font-size:12.5px; box-shadow:0 6px 18px var(--shadow);
  opacity:0; pointer-events:none; transition:all .25s ease; z-index:100;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.hidden{display:none !important;}

/* dim layer behind the sidebar when it is open over the canvas on a phone */
#sidebar-backdrop{display:none; position:absolute; inset:0; z-index:19; background:rgba(0,0,0,.5);}

/* ============ TOUCH SCREENS ============ */
@media (pointer:coarse){
  .el-toolbar button{width:32px; height:32px;}
  .el-toolbar button svg{width:15px; height:15px;}
  .resize-handle{width:22px; height:22px;}
  .rh-nw{top:-11px; left:-11px;}
  .rh-ne{top:-11px; right:-11px;}
  .rh-sw{bottom:-11px; left:-11px;}
  .rh-se{bottom:-11px; right:-11px;}
}
/* the rename / delete buttons only appeared on hover, which a finger never does */
@media (hover:none){
  .project-item .row-btns{display:flex;}
  .project-item .icon-btn{width:28px; height:28px;}
}

/* ============ PHONES ============ */
@media (max-width: 720px){
  :root{--sbw:min(264px, 82vw);}

  /* sidebar floats over the canvas, with a backdrop to tap away */
  #sidebar{position:absolute; top:0; left:0; height:100%; box-shadow:0 0 30px var(--shadow);}
  #sidebar:not(.collapsed) ~ #sidebar-backdrop{display:block;}
  /* while it is open, nothing else may poke through on top of it */
  #sidebar:not(.collapsed) ~ #main #history-controls,
  #sidebar:not(.collapsed) ~ #main #theme-toggle,
  #sidebar:not(.collapsed) ~ #main #zoom-controls,
  #sidebar:not(.collapsed) ~ #main #toolbar,
  #sidebar:not(.collapsed) ~ #main #sketch-panel,
  #sidebar:not(.collapsed) ~ #main #canvas-topbar,
  #sidebar:not(.collapsed) ~ #main #offscreen-markers,
  #sidebar:not(.collapsed) ~ #main #rec-chip,
  #sidebar:not(.collapsed) ~ #main #lost-chip{visibility:hidden;}
  #sidebar.collapsed ~ #sidebar-toggle{left:10px; top:10px;}

  /* top row: [menu] [title] ........ [undo redo] [theme] */
  #canvas-topbar{top:10px; flex-wrap:wrap; row-gap:6px;}
  #sidebar.collapsed ~ #main #canvas-topbar{left:56px;}
  #project-title{width:min(260px, calc(100vw - 200px)); max-width:none; min-width:0; font-size:16px;}
  #save-indicator{display:none;}
  #theme-toggle{top:10px; right:10px; width:36px; height:36px;}
  #history-controls{top:10px; right:54px;}
  #history-controls button{width:30px; height:30px;}

  /* zoom buttons become a column on the right edge, clear of the bottom bar
     (a phone has no scroll wheel, so these matter) */
  #zoom-controls{
    flex-direction:column; top:50%; bottom:auto; right:8px;
    transform:translateY(-50%); border-radius:18px;
  }
  #zoom-controls button{width:34px; height:34px;}
  #zoom-pct{width:34px; font-size:10px;}

  /* the bottom bar: sized to the screen, scrolls sideways if it ever has to */
  #toolbar{
    bottom:10px; left:50%; transform:translateX(-50%);
    width:max-content; max-width:calc(100vw - 16px);
    overflow-x:auto; overflow-y:hidden; justify-content:flex-start;
    gap:2px; padding:5px; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  #toolbar::-webkit-scrollbar{display:none;}
  .tb-btn{width:38px; height:38px; flex:none;}
  .tb-sep{flex:none; margin:0 3px;}
  .tb-btn .tt{display:none;}   /* tooltips are useless on touch, and clip inside a scroller */

  /* panels that sit above the bottom bar */
  .sketch-panel{
    bottom:70px; width:max-content; max-width:calc(100vw - 16px);
    flex-wrap:wrap; justify-content:center; row-gap:6px;
    border-radius:18px; padding:8px 12px;
  }
  .sk-sep{display:none;}
  #sketch-width{width:90px;}
  #rec-chip{bottom:70px;}
  #lost-chip{top:54px; max-width:calc(100vw - 16px); white-space:nowrap;}
  #lost-chip kbd{display:none;}
  #empty-state{max-width:80vw;}

  /* a selected card's toolbar is ~16 buttons: wrap it instead of running off-screen */
  .el-toolbar{flex-wrap:wrap; max-width:min(300px, 80vw); top:auto; bottom:calc(100% + 8px);}
  .el.tb-below .el-toolbar{top:calc(100% + 10px); bottom:auto;}
  .el.tb-below .adjust-pop{top:calc(100% + 110px);}
}
</style>

<script>
(function(){
"use strict";

/* ============================================================
   IndexedDB layer
=============================================================*/
const DB_NAME = "muse-db-v1", STORE = "projects";
let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    try{
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:"id"});
      };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    }catch(err){ reject(err); }
  });
  return dbPromise;
}
async function dbGetAll(){
  try{
    const db = await openDB();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE,"readonly");
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = ()=>resolve(req.result || []);
      req.onerror = ()=>reject(req.error);
    });
  }catch(err){ console.warn("DB read failed", err); return []; }
}
async function dbPut(project){
  try{
    const db = await openDB();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE,"readwrite");
      tx.objectStore(STORE).put(project);
      tx.oncomplete = resolve;
      tx.onerror = ()=>reject(tx.error);
    });
    return true;
  }catch(err){ console.warn("DB write failed", err); return false; }
}
async function dbDelete(id){
  try{
    const db = await openDB();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE,"readwrite");
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = resolve;
      tx.onerror = ()=>reject(tx.error);
    });
  }catch(err){ console.warn("DB delete failed", err); }
}

/* ============================================================
   State
=============================================================*/
let projects = [];        // {id,name,updatedAt,camera,elements:[...]}
let currentId = null;
let selection = new Set();
let tool = "select";       // select | sketch | connect
let connectFrom = null;
let camera = {x:0,y:0,scale:1};
let uidCounter = 1;
const mqMobile = window.matchMedia("(max-width: 720px)");
const touchPts = new Map();   // fingers currently down on the stage
let pinch = null;             // {d, cx, cy} while two fingers are down
function closeSidebarOnMobile(){
  if(!mqMobile.matches) return;
  document.getElementById("sidebar").classList.add("collapsed");
  scheduleMarkers();
  setTimeout(scheduleMarkers, 320);
}
function uid(){ return "id" + (Date.now().toString(36)) + (uidCounter++).toString(36); }

/* ---------- Undo / redo history ---------- */
let undoStack = [];
let redoStack = [];
const HISTORY_LIMIT = 60;

function cloneForHistory(value){
  if(value instanceof Blob) return value;
  if(Array.isArray(value)) return value.map(cloneForHistory);
  if(value && typeof value === "object"){
    const out = {};
    for(const k in value) out[k] = cloneForHistory(value[k]);
    return out;
  }
  return value;
}
function snapshotState(){
  return { projects: cloneForHistory(projects), currentId };
}
function commitHistory(snapshot){
  undoStack.push(snapshot);
  if(undoStack.length > HISTORY_LIMIT) undoStack.shift();
  redoStack.length = 0;
  updateHistoryButtons();
}
function pushHistory(){
  commitHistory(snapshotState());
}
async function syncAllToDB(){
  try{
    const existing = await dbGetAll();
    const keepIds = new Set(projects.map(p=>p.id));
    for(const p of existing){ if(!keepIds.has(p.id)) await dbDelete(p.id); }
    for(const p of projects){ await dbPut(p); }
  }catch(err){ console.warn("sync failed", err); }
}
function restoreState(state){
  projects = cloneForHistory(state.projects);
  currentId = state.currentId;
  if(!projects.length){ projects.push(makeBlankProject("Untitled project")); }
  if(!projects.find(p=>p.id===currentId)) currentId = projects[0].id;
  selection.clear();
  connectFrom = null;
  renderSidebar();
  loadProjectIntoCanvas(currentId);
  syncAllToDB();
  updateHistoryButtons();
}
function undo(){
  if(!undoStack.length){ showToast("Nothing to undo"); return; }
  redoStack.push(snapshotState());
  const prev = undoStack.pop();
  restoreState(prev);
  showToast("Undid last change");
}
function redo(){
  if(!redoStack.length){ showToast("Nothing to redo"); return; }
  undoStack.push(snapshotState());
  const next = redoStack.pop();
  restoreState(next);
  showToast("Redid change");
}
function updateHistoryButtons(){
  const u = document.getElementById("undo-btn"), r = document.getElementById("redo-btn");
  if(u) u.disabled = undoStack.length===0;
  if(r) r.disabled = redoStack.length===0;
}

const el = (sel,root)=> (root||document).querySelector(sel);
const els = (sel,root)=> Array.from((root||document).querySelectorAll(sel));

const stage = el("#stage");
const world = el("#world");
const layer = el("#elements-layer");
const connectorSvg = el("#connector-svg");
const groupBox = el("#group-box");
const marquee = el("#marquee");
const emptyState = el("#empty-state");
const projectTitleInput = el("#project-title");
const saveIndicator = el("#save-indicator");
const zoomPct = el("#zoom-pct");
const toast = el("#toast");
const sketchOverlay = el("#sketch-overlay");

/* ------------------------------------------------------------
   Element popovers (adjust / tag / note colour / rotate)
   Only one is ever open, and it belongs to the element it was
   opened from. Anything else you touch closes it.
---------------------------------------------------------------*/
function closePopovers(exceptFrame){
  els(".adjust-pop").forEach(p=>{
    if(exceptFrame && p.closest(".el-frame") === exceptFrame) return;
    p.remove();
  });
}
/* open the popover named `kind` on this element, or close it if it's
   already the one showing. Returns the new popover, or null on a close. */
function togglePopover(frame, kind, build){
  const mine = el('.adjust-pop[data-pop="'+kind+'"]', frame);
  closePopovers();
  if(mine) return null;
  const pop = document.createElement("div");
  pop.className = "adjust-pop";
  pop.dataset.pop = kind;
  pop.addEventListener("pointerdown", e=> e.stopPropagation());
  pop.addEventListener("click", e=> e.stopPropagation());
  pop.addEventListener("dblclick", e=> e.stopPropagation());
  // into the upright chrome layer, never the rotating frame
  (frame.__chrome || el(".el-chrome", frame) || frame).appendChild(pop);
  build(pop);
  requestAnimationFrame(()=> keepPopoverOnScreen(pop));
  return pop;
}
/* a panel opened on an element near the edge used to run off the screen */
function keepPopoverOnScreen(pop){
  if(!pop.isConnected) return;
  const vp = stage.getBoundingClientRect();
  const r = pop.getBoundingClientRect();
  const s = camera.scale || 1;
  let dx = 0;
  if(r.right > vp.right - 12) dx = (vp.right - 12) - r.right;
  if(r.left + dx < vp.left + 12) dx = (vp.left + 12) - r.left;
  if(dx) pop.style.marginLeft = (dx / s) + "px";
  const r2 = pop.getBoundingClientRect();
  if(r2.bottom > vp.bottom - 12 && r2.height < vp.height - 80){
    pop.style.top = "auto";
    pop.style.bottom = "calc(100% + 12px)";
  }
}

/* ------------------------------------------------------------
   Rotation. Stored on the element as `rot` (degrees) and applied
   to the whole card, so it works the same for an image, a video,
   a YouTube embed, a note, a sketch or a section.
---------------------------------------------------------------*/
function normRot(deg){ return ((Math.round(deg) % 360) + 360) % 360; }
function applyRotation(node, data){
  if(!node) return;
  const r = normRot(data.rot || 0);
  node.style.transformOrigin = "50% 50%";
  node.style.transform = r ? ("rotate(" + r + "deg)") : "";
  // undo the same turn on the controls layer, about the same centre, so the
  // toolbar and any open panel stay upright and in place
  const chrome = node.__chrome || el(".el-chrome", node);
  if(!chrome) return;
  chrome.style.transform = r ? ("rotate(" + (-r) + "deg)") : "";
  // The controls stay pinned to the card's own box and never shift with the
  // angle. Pushing them out by the card's on-screen span made the panel walk
  // up and down while you dragged the slider. They sit above the artwork
  // anyway, so an overlap at some angles costs nothing.
}
function setRotation(data, deg){
  data.rot = normRot(deg);
  applyRotation(document.getElementById(data.id), data);
  scheduleSave();
}

/* ------------------------------------------------------------
   Gesture bookkeeping.
   Anything that owns the pointer (drag, resize, sketch, crop,
   annotate) registers here. While a gesture is live we suppress
   text selection and single-key shortcuts, which is what used to
   make stray text boxes appear mid-crop / mid-resize.
-------------------------------------------------------------*/
let gestureCount = 0;
function beginGesture(){
  gestureCount++;
  document.body.classList.add("gesture-active");
}
function endGesture(){
  gestureCount = Math.max(0, gestureCount - 1);
  if(gestureCount === 0) document.body.classList.remove("gesture-active");
}
// a crop/annotate session that is open but idle still counts as "busy"
let activeToolCancel = null;
function toolOverlayOpen(){
  return !!document.querySelector(".tool-overlay, .annotate-canvas");
}
function isBusy(){
  return gestureCount > 0 || toolOverlayOpen();
}
function cancelActiveTool(){
  if(activeToolCancel){ const f = activeToolCancel; activeToolCancel = null; f(); return true; }
  return false;
}

/* Pointer capture keeps a gesture alive when the cursor crosses an
   iframe, a <video>, or leaves the window. Without it a sketch or a
   drag silently dies the moment you pass over an embed. */
/* ------------------------------------------------------------
   Object URL bookkeeping.
   Every URL.createObjectURL used to live until the tab closed,
   so a long session with lots of media leaked steadily. Blob
   URLs are now owned by the element that made them and revoked
   when it goes away or the board is swapped out.
-------------------------------------------------------------*/
const objectUrls = new Map();     // elementId -> [url, ...]
function makeObjectUrl(elemId, blob){
  const url = URL.createObjectURL(blob);
  if(!objectUrls.has(elemId)) objectUrls.set(elemId, []);
  objectUrls.get(elemId).push(url);
  return url;
}
function releaseObjectUrls(elemId){
  const list = objectUrls.get(elemId);
  if(!list) return;
  list.forEach(u=>{ try{ URL.revokeObjectURL(u); }catch(err){} });
  objectUrls.delete(elemId);
}
function releaseAllObjectUrls(){
  objectUrls.forEach(list=> list.forEach(u=>{ try{ URL.revokeObjectURL(u); }catch(err){} }));
  objectUrls.clear();
}

function capturePointer(e){
  try{ stage.setPointerCapture(e.pointerId); }catch(err){ /* capture unsupported */ }
  return ()=>{ try{ stage.releasePointerCapture(e.pointerId); }catch(err){} };
}

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toast.classList.remove("show"), 1600);
}

function currentProject(){
  return projects.find(p=>p.id===currentId);
}

/* ============================================================
   Camera / world transform
=============================================================*/
function applyCamera(){
  world.style.transform = `translate(${camera.x}px, ${camera.y}px) scale(${camera.scale})`;
  zoomPct.textContent = Math.round(camera.scale*100)+"%";
  scheduleMarkers();
}
function screenToWorld(sx, sy){
  const r = stage.getBoundingClientRect();
  return {
    x: (sx - r.left - camera.x) / camera.scale,
    y: (sy - r.top - camera.y) / camera.scale
  };
}
function zoomAt(sx, sy, factor){
  const r = stage.getBoundingClientRect();
  const mx = sx - r.left, my = sy - r.top;
  const worldX = (mx - camera.x)/camera.scale;
  const worldY = (my - camera.y)/camera.scale;
  let ns = camera.scale * factor;
  ns = Math.min(2.5, Math.max(0.15, ns));
  camera.x = mx - worldX*ns;
  camera.y = my - worldY*ns;
  camera.scale = ns;
  applyCamera();
  saveCamera();
}
function centerViewWorld(){
  const r = stage.getBoundingClientRect();
  return screenToWorld(r.left + r.width/2, r.top + r.height/2);
}
function saveCamera(){
  const p = currentProject();
  if(p){ p.camera = {...camera}; scheduleSave(); }
}

/* ============================================================
   Project management
=============================================================*/
async function initApp(){
  const stored = await dbGetAll();
  if(stored.length){
    projects = stored.sort((a,b)=> (b.updatedAt||0)-(a.updatedAt||0));
  } else {
    projects = [makeBlankProject("First idea")];
    await dbPut(projects[0]);
  }
  currentId = projects[0].id;
  renderSidebar();
  loadProjectIntoCanvas(currentId);
  // Always open at 100%, centred on your work. A board saved while zoomed
  // right out used to reopen at that zoom, which read as "Muse starts at 15%".
  resetZoomToActualSize();
  applyTheme(localStorage.getItem("muse-theme") || "dark");
}

/* 100% zoom, keeping the current content (or the saved view) in the middle */
function resetZoomToActualSize(animate){
  const p = currentProject();
  const r = stage.getBoundingClientRect();
  let cx, cy;
  if(p && p.elements && p.elements.length){
    const b = rectOfMany(p.elements);
    cx = b.x + b.w/2; cy = b.y + b.h/2;
  } else {
    const c = centerViewWorld();
    cx = c.x; cy = c.y;
  }
  const target = { scale:1, x: r.width/2 - cx, y: r.height/2 - cy };
  if(animate){ animateCamera(target); }
  else {
    camera.scale = target.scale; camera.x = target.x; camera.y = target.y;
    applyCamera(); saveCamera();
  }
}

function makeBlankProject(name){
  return {
    id: uid(),
    name: name || "Untitled project",
    updatedAt: Date.now(),
    camera:{x:0,y:0,scale:1},
    elements: []
  };
}

function renderSidebar(){
  const list = el("#project-list");
  const q = el("#search-input").value.trim().toLowerCase();
  list.innerHTML = "";
  const filtered = projects.filter(p=> p.name.toLowerCase().includes(q));
  const hits = elementSearchHits(q);
  if(!filtered.length && !hits.length){
    const d = document.createElement("div");
    d.className = "empty-hint";
    d.textContent = q ? "Nothing matches that, on any board." : "No projects yet.";
    list.appendChild(d);
    return;
  }
  filtered.forEach(p=>{
    const item = document.createElement("div");
    item.className = "project-item" + (p.id===currentId ? " active":"");
    item.dataset.id = p.id;
    item.innerHTML = `
      <span class="dot"></span>
      <span class="name" spellcheck="false">${escapeHtml(p.name)}</span>
      <span class="row-btns">
        <button class="icon-btn rename-btn" title="Rename"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5l4 4L8 20H4v-4L16.5 3.5z"/></svg></button>
        <button class="icon-btn delete-btn" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
      </span>`;
    item.addEventListener("click",(e)=>{
      if(e.target.closest(".row-btns")) return;
      if(e.target.isContentEditable) return;
      switchProject(p.id);
      closeSidebarOnMobile();
    });
    const nameEl = el(".name",item);
    el(".rename-btn",item).addEventListener("click",(e)=>{
      e.stopPropagation();
      pushHistory();
      nameEl.setAttribute("contenteditable","true");
      nameEl.focus();
      selectAllText(nameEl);
    });
    nameEl.addEventListener("keydown",(e)=>{
      if(e.key==="Enter"){ e.preventDefault(); nameEl.blur(); }
      if(e.key==="Escape"){ nameEl.textContent = p.name; nameEl.blur(); }
    });
    nameEl.addEventListener("blur",()=>{
      nameEl.removeAttribute("contenteditable");
      const val = nameEl.textContent.trim() || "Untitled project";
      p.name = val; nameEl.textContent = val;
      if(p.id===currentId) projectTitleInput.value = val;
      p.updatedAt = Date.now();
      dbPut(stripForSave(p));
    });
    el(".delete-btn",item).addEventListener("click",(e)=>{
      e.stopPropagation();
      deleteProject(p.id);
    });
    list.appendChild(item);
  });
  renderSearchHits(list, hits);
}
function renderSearchHits(list, hits){
  if(!hits || !hits.length) return;
  const head = document.createElement("div");
  head.className = "search-head";
  head.textContent = hits.length === 1 ? "1 match on your boards" : hits.length + " matches on your boards";
  list.appendChild(head);
  hits.forEach(h=>{
    const item = document.createElement("div");
    item.className = "hit-item";
    const t = document.createElement("div");
    t.className = "hit-text";
    t.textContent = h.text.length > 62 ? h.text.slice(0,62) + "\u2026" : h.text;
    const w = document.createElement("div");
    w.className = "hit-where";
    w.textContent = h.projectName;
    item.appendChild(t); item.appendChild(w);
    item.title = "Fly to this on " + h.projectName;
    item.addEventListener("click",()=>{ closeSidebarOnMobile(); goToElement(h.projectId, h.id); });
    list.appendChild(item);
  });
}
function selectAllText(node){
  try{
    const range = document.createRange();
    range.selectNodeContents(node);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }catch(err){ /* selection API unavailable; typing still works */ }
}
function escapeHtml(s){
  const d = document.createElement("div"); d.textContent = s; return d.innerHTML;
}

async function addProject(){
  const p = makeBlankProject("Untitled project " + (projects.length+1));
  projects.unshift(p);
  await dbPut(p);
  renderSidebar();
  switchProject(p.id);
  closeSidebarOnMobile();
}

function switchProject(id){
  if(id === currentId) return;
  persistCurrentImmediate();
  currentId = id;
  renderSidebar();
  loadProjectIntoCanvas(id);
}

async function deleteProject(id){
  if(projects.length===1){ showToast("You need at least one project."); return; }
  if(!confirm("Delete this project and everything on its board?")) return;
  pushHistory();
  projects = projects.filter(p=>p.id!==id);
  await dbDelete(id);
  if(id===currentId){
    currentId = projects[0].id;
    loadProjectIntoCanvas(currentId);
  }
  renderSidebar();
}

function loadProjectIntoCanvas(id){
  const p = currentProject();
  selection.clear();
  connectFrom = null;
  cancelActiveTool();
  sketchActive = false;
  sketchPoints = [];
  if(sketchPreviewNode){ sketchPreviewNode.remove(); sketchPreviewNode = null; }
  sketchOverlay.innerHTML = "";
  releaseAllObjectUrls();   // the outgoing board's blob URLs are dead now
  layer.innerHTML = "";
  camera = p.camera ? {...p.camera} : {x:0,y:0,scale:1};
  applyCamera();
  projectTitleInput.value = p.name;
  tagFilter.clear();
  (p.elements||[]).forEach(data=> mountElement(data));
  updateEmptyState();
  renderConnectors();
  updateSelectionUI();
  renderTagFilter();
  applyTagFilter();
}

function updateEmptyState(){
  const p = currentProject();
  emptyState.style.display = (p.elements && p.elements.length) ? "none" : "block";
  scheduleMarkers();
}

/* debounce save */
let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistCurrentImmediate, 500);
}
async function persistCurrentImmediate(){
  const p = currentProject();
  if(!p) return;
  p.updatedAt = Date.now();
  const ok = await dbPut(stripForSave(p));
  if(ok){
    saveIndicator.textContent = "saved";
    saveIndicator.classList.add("show");
    clearTimeout(persistCurrentImmediate._t);
    persistCurrentImmediate._t = setTimeout(()=> saveIndicator.classList.remove("show"), 1200);
  }
}
function stripForSave(p){
  // structured clone via IndexedDB supports Blobs directly; just return as-is
  return p;
}

/* ============================================================
   Element data model helpers
=============================================================*/
function addElementData(data){
  pushHistory();
  const p = currentProject();
  data.z = (p.elements.reduce((m,e)=>Math.max(m,e.z||0),0)) + 1;
  p.elements.push(data);
  mountElement(data);
  updateEmptyState();
  scheduleSave();
  return data;
}
function getElData(elemId){
  const p = currentProject();
  return p.elements.find(e=>e.id===elemId);
}
function removeElementData(elemId, silent){
  // silent skips the history push: the eraser snapshots once for a whole
  // drag instead of once per stroke it wipes out
  if(!silent) pushHistory();
  const p = currentProject();
  // a section is a container: deleting it deletes what it holds. One history
  // entry covers the lot, so a single undo brings everything back.
  const target = getElData(elemId);
  if(target && target.type === "section"){
    sectionContents(target).forEach(id=> removeElementData(id, true));
  }
  p.elements = p.elements.filter(e=>e.id!==elemId);
  p.connectors = (p.connectors||[]).filter(c=> c.a!==elemId && c.b!==elemId);
  const node = document.getElementById(elemId);
  if(node) node.remove();
  releaseObjectUrls(elemId);
  selection.delete(elemId);
  updateEmptyState();
  renderConnectors();
  updateSelectionUI();
  renderTagFilter();
  scheduleSave();
}
function bringToFront(elemId){
  const p = currentProject();
  const maxZ = p.elements.reduce((m,e)=>Math.max(m,e.z||0),0);
  const d = getElData(elemId);
  if(!d) return;
  d.z = maxZ+1;
  const n = document.getElementById(elemId);
  if(n) n.style.zIndex = d.z;
  scheduleSave();
}
function sendToBack(elemId){
  const p = currentProject();
  const minZ = p.elements.reduce((m,e)=>Math.min(m, e.z||0), 0);
  const d = getElData(elemId);
  if(!d) return;
  d.z = minZ-1;
  const n = document.getElementById(elemId);
  if(n) n.style.zIndex = d.z;
  scheduleSave();
}

/* ============================================================
   Mounting / rendering elements
=============================================================*/
function mountElement(data){
  const node = document.createElement("div");
  node.className = "el el-" + data.type + (data.locked ? " locked" : "");
  node.id = data.id;
  node.style.left = data.x+"px";
  node.style.top = data.y+"px";
  node.style.width = data.w+"px";
  node.style.height = data.h+"px";
  node.style.zIndex = data.z||1;

  const frame = document.createElement("div");
  frame.className = "el-frame";
  node.appendChild(frame);

  // controls live in their own layer so rotation never reaches them
  const chrome = document.createElement("div");
  chrome.className = "el-chrome";
  frame.appendChild(chrome);
  frame.__chrome = chrome;
  node.__chrome = chrome;

  const toolbar = document.createElement("div");
  toolbar.className = "el-toolbar";
  chrome.appendChild(toolbar);

  const lockBadge = document.createElement("div");
  lockBadge.className = "lock-badge";
  lockBadge.title = "Locked";
  lockBadge.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  chrome.appendChild(lockBadge);

  const tagDot = document.createElement("div");
  tagDot.className = "tag-stripe";
  frame.appendChild(tagDot);

  ["nw","ne","sw","se"].forEach(h=>{
    const rh = document.createElement("div");
    rh.className = "resize-handle rh-"+h;
    rh.dataset.h = h;
    frame.appendChild(rh);
  });

  if(data.type === "text"){
    buildTextEl(node, frame, toolbar, data);
  } else if(data.type === "image"){
    buildImageEl(node, frame, toolbar, data);
  } else if(data.type === "youtube"){
    buildYoutubeEl(node, frame, toolbar, data);
  } else if(data.type === "video"){
    buildVideoEl(node, frame, toolbar, data);
  } else if(data.type === "sketch"){
    buildSketchEl(node, frame, toolbar, data);
  } else if(data.type === "palette"){
    buildPaletteEl(node, frame, toolbar, data);
  } else if(data.type === "audio"){
    buildAudioEl(node, frame, toolbar, data);
  } else if(data.type === "section"){
    buildSectionEl(node, frame, toolbar, data);
  }

  addCommonToolbarButtons(toolbar, data);
  layer.appendChild(node);
  applyRotation(node, data);
  bindElementInteraction(node, data);
  applyTagLook(data);
  if(tagFilter.size) applyTagFilter();
  return node;
}

function addCommonToolbarButtons(toolbar, data){
  addTagButton(toolbar, data);
  addRotateButton(toolbar, data);

  const lock = document.createElement("button");
  lock.className = "lock-btn" + (data.locked ? " on" : "");
  lock.title = lockTitleFor(data, !!data.locked);
  lock.innerHTML = lockIconSvg(!!data.locked);
  lock.addEventListener("click",(e)=>{
    e.stopPropagation();
    pushHistory();
    setElementLocked(data.id, !data.locked);
    let carried = 0;
    // a locked section holds everything inside it still; unlock one item on
    // its own when you want to take it out
    if(data.type === "section") carried = applySectionLock(data, !!data.locked);
    updateSelectionUI();
    scheduleSave();
    if(data.type === "section" && carried){
      showToast(data.locked
        ? "Section locked, and the " + carried + " item" + (carried===1?"":"s") + " inside it"
        : "Section unlocked, and the " + carried + " item" + (carried===1?"":"s") + " inside it");
    } else {
      showToast(data.locked ? "Locked in place" : "Unlocked");
    }
  });
  toolbar.appendChild(lock);

  const back = document.createElement("button");
  back.title = "Send to back";
  back.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="12" height="12" rx="1.5"/><path d="M19 9v9a1 1 0 0 1-1 1H9"/></svg>';
  back.addEventListener("click",(e)=>{ e.stopPropagation(); sendToBack(data.id); });
  toolbar.appendChild(back);

  const front = document.createElement("button");
  front.title = "Bring to front";
  front.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="12" height="12" rx="1.5"/><path d="M5 15V6a1 1 0 0 1 1-1h9"/></svg>';
  front.addEventListener("click",(e)=>{ e.stopPropagation(); bringToFront(data.id); });
  toolbar.appendChild(front);

  const dup = document.createElement("button");
  dup.title = "Duplicate";
  dup.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>';
  dup.addEventListener("click",(e)=>{ e.stopPropagation(); duplicateElement(data.id); });
  toolbar.appendChild(dup);

  const del = document.createElement("button");
  del.className = "danger";
  del.title = data.type === "section" ? "Delete the section and everything in it" : "Delete";
  del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';
  del.addEventListener("click",(e)=>{
    e.stopPropagation();
    // a section is a container, so it takes its contents with it
    const inside = data.type === "section" ? sectionContents(data).length : 0;
    removeElementData(data.id);
    if(inside){
      showToast("Section deleted with the " + inside + " item" + (inside===1?"":"s") +
                " inside it — Ctrl+Z puts it back");
    }
  });
  toolbar.appendChild(del);
}

/* ---- sections as containers ----
   What counts as "inside" is the element's centre point, the same test the
   drag already used to decide what a section carries with it. */
function sectionContents(sec, opts){
  const p = currentProject();
  const skipLocked = opts && opts.skipLocked;
  const out = [];
  (p && p.elements || []).forEach(d=>{
    if(d.id === sec.id) return;
    // sections never hold other sections: two overlapping ones would each
    // claim the other
    if(d.type === "section") return;
    if(skipLocked && d.locked) return;
    const cx = d.x + d.w/2, cy = d.y + d.h/2;
    if(cx >= sec.x && cx <= sec.x+sec.w && cy >= sec.y && cy <= sec.y+sec.h) out.push(d.id);
  });
  return out;
}
/* the smallest section whose box contains this world point */
function sectionAtPoint(wx, wy, selectedOnly){
  const p = currentProject();
  let best = null;
  (p && p.elements || []).forEach(d=>{
    if(d.type !== "section") return;
    if(selectedOnly && !selection.has(d.id)) return;
    if(wx < d.x || wx > d.x+d.w || wy < d.y || wy > d.y+d.h) return;
    if(!best || (d.w*d.h) < (best.w*best.h)) best = d;
  });
  return best;
}

const lockIconSvg = (on)=> on
  ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
  : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.3-2.2"/></svg>';

function setElementLocked(id, on){
  const d = getElData(id);
  if(!d) return;
  d.locked = !!on;
  const n = document.getElementById(id);
  if(!n) return;
  n.classList.toggle("locked", !!on);
  const btn = el(".lock-btn", n);
  if(btn){
    btn.classList.toggle("on", !!on);
    btn.title = lockTitleFor(d, !!on);
    btn.innerHTML = lockIconSvg(!!on);
  }
}
function lockTitleFor(d, on){
  if(d && d.type === "section") return on ? "Unlock the section and its contents" : "Lock the section and its contents";
  return on ? "Unlock" : "Lock in place";
}

/* Locking a section locks what it holds. Unlocking gives back exactly the
   items the section locked, so anything you had locked on its own stays
   locked. Returns how many it touched. */
function applySectionLock(sec, on){
  if(on){
    const ids = sectionContents(sec).filter(id=>{
      const d = getElData(id);
      return d && !d.locked;
    });
    sec.lockedIds = ids.slice();
    ids.forEach(id=> setElementLocked(id, true));
    return ids.length;
  }
  const ids = Array.isArray(sec.lockedIds) ? sec.lockedIds : sectionContents(sec);
  let n = 0;
  ids.forEach(id=>{
    const d = getElData(id);
    if(!d) return;
    setElementLocked(id, false);
    n++;
  });
  sec.lockedIds = null;
  return n;
}

/* Rotate — the same control on every kind of element */
function addRotateButton(toolbar, data){
  const btn = document.createElement("button");
  btn.className = "rot-btn";
  btn.title = "Rotate";

  btn.addEventListener("click",(e)=>{
    e.stopPropagation();

    togglePopover(frame, "rot", (pop)=>{
      pop.classList.add("rot-pop");
      pop.innerHTML =
        '<div class="ap-row"><span class="ap-label">Rotate</span>' +
          '<div class="ap-seg">' +
            '<button data-r="-90" title="90° left">↺</button>' +
            '<button data-r="90" title="90° right">↻</button>' +
            '<button data-r="reset" title="Back to upright">Reset</button>' +
          '</div></div>' +
        '<div class="ap-row"><span class="ap-label">Angle</span>' +
          '<input type="range" class="ap-rot" min="0" max="359" step="1">' +
          '<span class="ap-val"></span></div>';
      const slider = el(".ap-rot", pop), val = el(".ap-val", pop);
      const sync = ()=>{
        const r = normRot(data.rot || 0);
        slider.value = r;
        val.textContent = r + "°";
      };
      els("[data-r]", pop).forEach(b=>{
        b.addEventListener("click",(e2)=>{
          e2.stopPropagation();
          pushHistory();
          const v = b.dataset.r;
          setRotation(data, v === "reset" ? 0 : (data.rot || 0) + parseInt(v,10));
          sync();

        });
      });
      let armed = true;

      slider.addEventListener("input",()=>{
