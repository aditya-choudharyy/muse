        applyRotation(document.getElementById(data.id), data);
        val.textContent = normRot(data.rot) + "°";
      });
      slider.addEventListener("change",()=>{ armed = true; scheduleSave(); });
      sync();
    });
  });
  toolbar.appendChild(btn);
}

function duplicateElement(elemId){
  const d = getElData(elemId);
  const copy = JSON.parse(JSON.stringify(d, (k,v)=> k==="blob" ? undefined : v));
  copy.id = uid();
  copy.x = d.x + 24;
  copy.y = d.y + 24;
  if(d.blob) copy.blob = d.blob;
  addElementData(copy);
  selectOnly(copy.id);
}

/* ---- Text element ---- */
function buildTextEl(node, frame, toolbar, data){
  const txt = document.createElement("div");
  txt.className = "txt";
  txt.contentEditable = "false";
  txt.style.fontSize = (data.fontSize||20)+"px";
  txt.style.setProperty("--el-color", data.color || "var(--text)");
  // --el-bg is read by .el-text .el-frame, the PARENT of .txt. Setting the
  // custom property on .txt put it out of reach of the rule that uses it,
  // so a note background could never show. It belongs on the element root.
  applyNoteBg(node, data);
  txt.style.textAlign = data.align || "left";
  txt.textContent = data.text || "";
  frame.appendChild(txt);

  node.addEventListener("dblclick",(e)=>{
    if(e.target.closest(".el-toolbar")||e.target.closest(".resize-handle")) return;
    enterTextEdit(node, txt, data);
  });

  // font size buttons + color swatches
  const dec = mkToolBtn('−', "Smaller text");
  dec.addEventListener("click",(e)=>{ e.stopPropagation(); setFontSize(data, txt, node, (data.fontSize||20)-2); });
  const inc = mkToolBtn('+', "Bigger text");
  inc.addEventListener("click",(e)=>{ e.stopPropagation(); setFontSize(data, txt, node, (data.fontSize||20)+2); });
  toolbar.appendChild(dec); toolbar.appendChild(inc);

  const colors = ["var(--text)","#E4664B","#5FA8A0","#D9B94A","#8C8CE0"];
  colors.forEach(c=>{
    const b = document.createElement("button");
    b.style.color = c === "var(--text)" ? "inherit" : c;
    b.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="currentColor"/></svg>';
    b.title = "Text color";
    b.addEventListener("click",(e)=>{
      e.stopPropagation();
      data.color = c;
      txt.style.setProperty("--el-color", c);
      applyNoteBg(node, data);   // a custom colour beats the automatic dark ink
      scheduleSave();
    });
    toolbar.appendChild(b);
  });

  // sticky-note background
  const noteBtn = document.createElement("button");
  noteBtn.title = "Note colour";
  noteBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h16v11l-5 5H4z"/><path d="M20 15h-5v5"/></svg>';
  noteBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    togglePopover(frame, "note", (pop)=>{
      pop.classList.add("note-pop", "text-pop");
      pop.innerHTML = '<div class="ap-label">Note colour</div><div class="tp-swatches"></div>';
      const row = el(".tp-swatches", pop);
      const none = document.createElement("button");
      none.className = "none" + (data.bg ? "" : " on");
      none.textContent = "\u00d7";
      none.title = "No background";
      none.addEventListener("click",(e2)=>{ e2.stopPropagation(); setNoteBg(node, data, null); pop.remove(); });
      row.appendChild(none);
      NOTE_COLORS.forEach(c=>{
        const b = document.createElement("button");
        b.style.background = c;
        if(data.bg === c) b.classList.add("on");
        b.addEventListener("click",(e2)=>{ e2.stopPropagation(); setNoteBg(node, data, c); pop.remove(); });
        row.appendChild(b);
      });
    });
  });
  toolbar.appendChild(noteBtn);
}
const NOTE_COLORS = ["#F5D77E","#F2A97E","#E88FA0","#9FD4C4","#9FBDE8","#C9B3E8","#E3DCCB"];
function applyNoteBg(node, data){
  const bg = data.bg;
  node.style.setProperty("--el-bg", bg || "transparent");
  node.classList.toggle("has-bg", !!bg);
  // Dark ink reads better on every one of these pastels, but only when the
  // user hasn't chosen a text colour of their own. Set on the element root:
  // this runs before .txt is appended, so a property set on .txt would be lost.
  const custom = data.color && data.color !== "var(--text)";
  node.style.setProperty("--el-bg-ink", (bg && !custom) ? "#26221a" : "");
}
function setNoteBg(node, data, bg){
  pushHistory();
  data.bg = bg;
  applyNoteBg(node, data);
  scheduleSave();
}
function mkToolBtn(label, title){
  const b = document.createElement("button");
  b.textContent = label; b.title = title; b.style.fontSize="14px"; b.style.fontWeight="600";
  return b;
}
function setFontSize(data, txt, node, size){
  size = Math.max(8, Math.min(220, size));
  data.fontSize = size;
  txt.style.fontSize = size+"px";
  scheduleSave();
}
function enterTextEdit(node, txt, data){
  if(node.__editing) { txt.focus(); return; }
  pushHistory();
  node.classList.add("editing");
  txt.contentEditable = "true";
  txt.focus();
  selectAllText(txt);
  node.__editing = true;
  const finish = ()=>{
    txt.contentEditable = "false";
    node.classList.remove("editing");
    data.text = txt.textContent;
    node.__editing = false;
    scheduleSave();
    scheduleMarkers();   // the arrow's hover label shows the note's text
    txt.removeEventListener("blur", finish);
    txt.removeEventListener("keydown", onKeydown);
  };
  const onKeydown = (e)=>{ if(e.key==="Escape"){ txt.blur(); } e.stopPropagation(); };
  txt.addEventListener("blur", finish);
  txt.addEventListener("keydown", onKeydown);
}

/* ---- Image element ---- */
function buildImageEl(node, frame, toolbar, data){
  const img = document.createElement("img");
  img.draggable = false;
  if(data.blob) img.src = makeObjectUrl(data.id, data.blob);
  else if(data.src) img.src = data.src;   // remote image dragged in from another tab
  frame.appendChild(img);
  node.__imgEl = img;

  const cropBtn = document.createElement("button");
  cropBtn.title = "Crop";
  cropBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"/></svg>';
  cropBtn.addEventListener("click",(e)=>{ e.stopPropagation(); startCrop(node, frame, img, data); });
  toolbar.appendChild(cropBtn);

  const annBtn = document.createElement("button");
  annBtn.title = "Annotate";
  annBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.5-5L15 5.5a2 2 0 0 1 2.8 0l.7.7a2 2 0 0 1 0 2.8L8 18.5 3 21z"/></svg>';
  annBtn.addEventListener("click",(e)=>{ e.stopPropagation(); startAnnotate(node, frame, img, data); });
  toolbar.appendChild(annBtn);

  const adjBtn = document.createElement("button");
  adjBtn.title = "Adjust (flip, grayscale, opacity, guides)";
  adjBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 12h3M11 12h9M4 17h8M16 17h4"/><circle cx="16" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="14" cy="17" r="2"/></svg>';
  adjBtn.addEventListener("click",(e)=>{ e.stopPropagation(); toggleAdjustPopover(node, frame, data); });
  toolbar.appendChild(adjBtn);

  img.addEventListener("load", ()=> applyImageLook(node, data));
  applyImageLook(node, data);
}

function computeContainRect(boxW, boxH, natW, natH){
  const boxRatio = boxW/boxH, natRatio = natW/natH;
  let w,h;
  if(natRatio > boxRatio){ w = boxW; h = boxW/natRatio; } else { h = boxH; w = boxH*natRatio; }
  return { x:(boxW-w)/2, y:(boxH-h)/2, w, h };
}

/* ============================================================
   Image reference tools
   Flip / grayscale / opacity / guides are non-destructive: they
   are CSS on the <img>, stored on the element, and baked into
   the pixels only when you crop or annotate.
=============================================================*/
function imageDisplayRect(node){
  const img = node.__imgEl;
  const bw = node.offsetWidth, bh = node.offsetHeight;
  const nw = (img && img.naturalWidth) || bw, nh = (img && img.naturalHeight) || bh;
  return computeContainRect(bw, bh, nw, nh);
}

function applyImageLook(node, data){
  const img = node.__imgEl;
  if(!img) return;
  const t = [];
  if(data.flipH) t.push("scaleX(-1)");
  if(data.flipV) t.push("scaleY(-1)");
  img.style.transform = t.join(" ");
  img.style.filter = data.grayscale ? "grayscale(1)" : "";
  img.style.opacity = (data.opacity == null ? 1 : data.opacity);

  const frame = el(".el-frame", node);
  let grid = el(".img-grid", node);
  if(!data.grid || data.grid === "none"){ if(grid) grid.remove(); return; }
  if(!grid){
    grid = document.createElement("div");
    grid.className = "img-grid";
    // the chrome layer sits above everything in the frame on its own z-index,
    // so the guides can simply go on the end
    frame.appendChild(grid);
  }
  grid.dataset.mode = data.grid;
  const r = imageDisplayRect(node);
  grid.style.left = r.x+"px"; grid.style.top = r.y+"px";
  grid.style.width = r.w+"px"; grid.style.height = r.h+"px";
}

/* the image as it currently LOOKS, at natural size — what crop and
   annotate must operate on, otherwise a flip would be silently undone */
function renderSourceCanvas(img, data){
  const c = document.createElement("canvas");
  c.width = img.naturalWidth || 1;
  c.height = img.naturalHeight || 1;
  const cx = c.getContext("2d");
  if(data.grayscale) cx.filter = "grayscale(1)";
  cx.save();
  if(data.flipH){ cx.translate(c.width, 0); cx.scale(-1, 1); }
  if(data.flipV){ cx.translate(0, c.height); cx.scale(1, -1); }
  cx.drawImage(img, 0, 0);
  cx.restore();
  return c;
}
function bakeImageLook(node, data){
  data.flipH = false; data.flipV = false; data.grayscale = false;
  applyImageLook(node, data);
}

function toggleAdjustPopover(node, frame, data){
  const pop = togglePopover(frame, "adjust", (p)=> buildAdjustPopover(p, node, data));
  return pop;
}
function buildAdjustPopover(pop, node, data){
  pop.innerHTML =
    '<div class="ap-row"><span class="ap-label">Flip</span>' +
      '<div class="ap-seg"><button data-act="fliph">Horizontal</button><button data-act="flipv">Vertical</button></div></div>' +
    '<div class="ap-row"><span class="ap-label">Grayscale</span>' +
      '<div class="ap-seg"><button data-act="gray">Value study</button></div></div>' +
    '<div class="ap-row"><span class="ap-label">Opacity</span>' +
      '<input type="range" class="ap-op" min="0.1" max="1" step="0.05">' +
      '<span class="ap-val"></span></div>' +
    '<div class="ap-row"><span class="ap-label">Guides</span>' +
      '<div class="ap-seg"><button data-g="none">Off</button><button data-g="thirds">Thirds</button>' +
      '<button data-g="grid">Grid</button><button data-g="cross">Centre</button></div></div>' +
    '<button class="ap-palette">Extract colour palette</button>';

  const opInput = el(".ap-op", pop), opVal = el(".ap-val", pop);
  function sync(){
    el('[data-act="fliph"]', pop).classList.toggle("on", !!data.flipH);
    el('[data-act="flipv"]', pop).classList.toggle("on", !!data.flipV);
    el('[data-act="gray"]', pop).classList.toggle("on", !!data.grayscale);
    const o = data.opacity == null ? 1 : data.opacity;
    opInput.value = o;
    opVal.textContent = Math.round(o*100)+"%";
    els("[data-g]", pop).forEach(b=> b.classList.toggle("on", (data.grid||"none") === b.dataset.g));
  }

  els("[data-act]", pop).forEach(b=>{
    b.addEventListener("click",(e)=>{
      e.stopPropagation();
      pushHistory();
      const a = b.dataset.act;
      if(a === "fliph") data.flipH = !data.flipH;
      if(a === "flipv") data.flipV = !data.flipV;
      if(a === "gray")  data.grayscale = !data.grayscale;
      applyImageLook(node, data); sync(); scheduleSave();
    });
  });
  els("[data-g]", pop).forEach(b=>{
    b.addEventListener("click",(e)=>{
      e.stopPropagation();
      pushHistory();
      data.grid = b.dataset.g;
      applyImageLook(node, data); sync(); scheduleSave();
    });
  });
  opInput.addEventListener("input",()=>{
    data.opacity = parseFloat(opInput.value);
    applyImageLook(node, data);
    opVal.textContent = Math.round(data.opacity*100)+"%";
  });
  opInput.addEventListener("change",()=> scheduleSave());
  el(".ap-palette", pop).addEventListener("click",(e)=>{
    e.stopPropagation();
    extractPalette(node, data);
    pop.remove();
  });

  sync();
}

function startCrop(node, frame, img, data){
  if(node.querySelector(".tool-overlay")) return;
  cancelActiveTool();
  // takes the element's own handles + toolbar off the board for the duration,
  // so the crop handles are the only thing under the cursor
  node.classList.add("tool-active");
  const boxW = node.offsetWidth, boxH = node.offsetHeight;
  const natW = img.naturalWidth || boxW, natH = img.naturalHeight || boxH;
  const disp = computeContainRect(boxW, boxH, natW, natH);

  const overlay = document.createElement("div");
  overlay.className = "tool-overlay";
  const rect = document.createElement("div");
  rect.className = "crop-rect";
  let cx=disp.x, cy=disp.y, cw=disp.w, ch=disp.h;
  const paint = ()=>{ rect.style.left=cx+"px"; rect.style.top=cy+"px"; rect.style.width=cw+"px"; rect.style.height=ch+"px"; };
  paint();
  ["nw","ne","sw","se"].forEach(h=>{
    const rh = document.createElement("div");
    rh.className = "resize-handle rh-"+h; rh.dataset.h=h;
    rect.appendChild(rh);
  });
  overlay.appendChild(rect);

  const actions = document.createElement("div");
  actions.className = "tool-actions";
  actions.innerHTML = '<button class="cancel">Cancel</button><button class="primary apply">Apply crop</button>';
  rect.appendChild(actions);
  frame.appendChild(overlay);

  const closeCrop = ()=>{
    overlay.remove();
    node.classList.remove("tool-active");
    if(activeToolCancel === closeCrop) activeToolCancel = null;
  };
  activeToolCancel = closeCrop;

  // swallow presses on the dimmed area so they never reach the element underneath
  overlay.addEventListener("pointerdown",(e)=> e.stopPropagation());

  // drag to move crop rect
  rect.addEventListener("pointerdown",(e)=>{
    if(e.target.closest(".resize-handle")||e.target.closest(".tool-actions")) return;
    e.stopPropagation();
    e.preventDefault();
    const release = capturePointer(e); beginGesture();
    const startX=e.clientX, startY=e.clientY, ox=cx, oy=cy;
    const move = (ev)=>{
      const dx=(ev.clientX-startX)/camera.scale, dy=(ev.clientY-startY)/camera.scale;
      cx = Math.min(Math.max(disp.x, ox+dx), disp.x+disp.w-cw);
      cy = Math.min(Math.max(disp.y, oy+dy), disp.y+disp.h-ch);
      paint();
    };
    const up = ()=>{
      window.removeEventListener("pointermove",move);
      window.removeEventListener("pointerup",up);
      window.removeEventListener("pointercancel",up);
      release(); endGesture();
    };
    window.addEventListener("pointermove",move);
    window.addEventListener("pointerup",up);
    window.addEventListener("pointercancel",up);
  });
  els(".resize-handle",rect).forEach(rh=>{
    rh.addEventListener("pointerdown",(e)=>{
      e.stopPropagation();
      e.preventDefault();
      const release = capturePointer(e); beginGesture();
      const handle = rh.dataset.h;
      const startX=e.clientX, startY=e.clientY, ox=cx, oy=cy, ow=cw, oh=ch;
      const move = (ev)=>{
        const dx=(ev.clientX-startX)/camera.scale, dy=(ev.clientY-startY)/camera.scale;
        let nx=ox, ny=oy, nw=ow, nh=oh;
        if(handle.includes("e")) nw = Math.max(20, ow+dx);
        if(handle.includes("s")) nh = Math.max(20, oh+dy);
        if(handle.includes("w")){ nw = Math.max(20, ow-dx); nx = ox+ow-nw; }
        if(handle.includes("n")){ nh = Math.max(20, oh-dy); ny = oy+oh-nh; }
        nx = Math.max(disp.x, nx); ny = Math.max(disp.y, ny);
        nw = Math.min(nw, disp.x+disp.w-nx); nh = Math.min(nh, disp.y+disp.h-ny);
        cx=nx; cy=ny; cw=nw; ch=nh; paint();
      };
      const up = ()=>{
        window.removeEventListener("pointermove",move);
        window.removeEventListener("pointerup",up);
        window.removeEventListener("pointercancel",up);
        release(); endGesture();
      };
      window.addEventListener("pointermove",move);
      window.addEventListener("pointerup",up);
      window.addEventListener("pointercancel",up);
    });
  });

  els("button",actions).forEach(b=> b.addEventListener("pointerdown", e=> e.stopPropagation()));
  el(".cancel",actions).addEventListener("click",(e)=>{ e.stopPropagation(); closeCrop(); });
  el(".apply",actions).addEventListener("click",(e)=>{
    e.stopPropagation();
    const scaleX = natW/disp.w, scaleY = natH/disp.h;
    const sx=(cx-disp.x)*scaleX, sy=(cy-disp.y)*scaleY, sw=cw*scaleX, sh=ch*scaleY;
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1,Math.round(sw)); canvas.height = Math.max(1,Math.round(sh));
    const ctx = canvas.getContext("2d");
    // crop what the user can SEE, flips and value-study included
    const srcCanvas = renderSourceCanvas(img, data);
    ctx.drawImage(srcCanvas, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    // an image loaded straight from another site taints the canvas, and
    // toBlob throws rather than returning anything
    try{
      canvas.toBlob((blob)=>{
        if(!blob){ showToast("Couldn't crop that image"); closeCrop(); return; }
        pushHistory();
        releaseObjectUrls(data.id);
        data.blob = blob;
        data.src = null;
        img.src = makeObjectUrl(data.id, blob);
        bakeImageLook(node, data);
        const newH = boxW * (canvas.height/canvas.width);
        data.h = newH;
        node.style.height = newH+"px";
        closeCrop();
        scheduleSave();
        showToast("Cropped");
      }, "image/png");
    }catch(err){
      closeCrop();
      showToast("This image is hosted elsewhere, so it can't be edited here. Save it and drop the file in.");
    }
  });
}

function startAnnotate(node, frame, img, data){
  if(node.querySelector(".tool-overlay")||node.querySelector(".annotate-canvas")) return;
  cancelActiveTool();
  node.classList.add("tool-active");
  const boxW = node.offsetWidth, boxH = node.offsetHeight;
  const natW = img.naturalWidth||boxW, natH = img.naturalHeight||boxH;
  const disp = computeContainRect(boxW, boxH, natW, natH);

  const canvas = document.createElement("canvas");
  canvas.className = "annotate-canvas";
  canvas.width = boxW; canvas.height = boxH;
  canvas.style.width = boxW+"px"; canvas.style.height = boxH+"px";
  frame.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  ctx.lineJoin="round"; ctx.lineCap="round"; ctx.lineWidth=3;
  let color = "#E4664B";
  ctx.strokeStyle = color;

  const colorsBar = document.createElement("div");
  colorsBar.className = "annotate-colors";
  ["#E4664B","#ffffff","#111111","#5FA8A0","#D9B94A"].forEach((c,i)=>{
    const b=document.createElement("button");
    b.style.background=c; if(i===0) b.classList.add("active");
    b.addEventListener("click",(e)=>{ e.stopPropagation(); color=c; ctx.strokeStyle=c; els(".annotate-colors button",colorsBar).forEach(x=>x.classList.remove("active")); b.classList.add("active"); });
    colorsBar.appendChild(b);
  });
  canvas.parentElement.appendChild(colorsBar);

  const actions = document.createElement("div");
  actions.className = "tool-actions";
  actions.innerHTML = '<button class="cancel">Cancel</button><button class="primary apply">Save annotation</button>';
  frame.appendChild(actions);

  let drawing=false, last=null;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)/camera.scale, y:(e.clientY-r.top)/camera.scale};
  }
  canvas.addEventListener("pointerdown",(e)=>{
    e.stopPropagation();
    e.preventDefault();
    drawing=true; last=pos(e);
    beginGesture();
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    // a dot, so a single tap leaves a mark
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(last.x+0.01,last.y); ctx.stroke();
  });
  canvas.addEventListener("pointermove",(e)=>{
    if(!drawing) return;
    e.stopPropagation();
    const pts = (e.getCoalescedEvents && e.getCoalescedEvents().length)
      ? e.getCoalescedEvents() : [e];
    pts.forEach(ev=>{
      const p = pos(ev);
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
      last=p;
    });
  });
  const stopDraw = (e)=>{
    if(!drawing) return;
    drawing=false;
    endGesture();
    if(e && e.pointerId!=null){ try{ canvas.releasePointerCapture(e.pointerId); }catch(err){} }
  };
  canvas.addEventListener("pointerup", stopDraw);
  canvas.addEventListener("pointercancel", stopDraw);
  window.addEventListener("pointerup", stopDraw);

  const cleanup = ()=>{
    canvas.remove(); colorsBar.remove(); actions.remove();
    node.classList.remove("tool-active");
    window.removeEventListener("pointerup", stopDraw);
    if(activeToolCancel === cleanup) activeToolCancel = null;
  };
  activeToolCancel = cleanup;
  colorsBar.addEventListener("pointerdown", e=> e.stopPropagation());
  els("button",actions).forEach(b=> b.addEventListener("pointerdown", e=> e.stopPropagation()));
  el(".cancel",actions).addEventListener("click",(e)=>{ e.stopPropagation(); cleanup(); });
  el(".apply",actions).addEventListener("click",(e)=>{
    e.stopPropagation();
    const out = document.createElement("canvas");
    out.width = boxW; out.height = boxH;
    const octx = out.getContext("2d");
    octx.drawImage(renderSourceCanvas(img, data), disp.x, disp.y, disp.w, disp.h);
    octx.drawImage(canvas, 0, 0);
    try{
      out.toBlob((blob)=>{
        if(!blob){ showToast("Couldn't save that annotation"); cleanup(); return; }
        pushHistory();
        releaseObjectUrls(data.id);
        data.blob = blob;
        data.src = null;
        img.src = makeObjectUrl(data.id, blob);
        bakeImageLook(node, data);
        cleanup();
        scheduleSave();
        showToast("Annotation saved");
      }, "image/png");
    }catch(err){
      cleanup();
      showToast("This image is hosted elsewhere, so it can't be edited here. Save it and drop the file in.");
    }
  });
}

/* ---- YouTube element ---- */
function parseYouTubeId(url){
  if(!url) return null;
  const s = String(url).trim();
  // watch?v=, youtu.be/, /embed/, /shorts/, /live/, /v/, and ?v= anywhere in the query
  const patterns = [
    /(?:youtube\.com|youtube-nocookie\.com)\/(?:embed|shorts|live|v)\/([A-Za-z0-9_-]{11})/,
    /youtu\.be\/([A-Za-z0-9_-]{11})/,
    /[?&]v=([A-Za-z0-9_-]{11})/
  ];
  for(const re of patterns){
    const m = s.match(re);
    if(m) return m[1];
  }
  // a bare 11-character id pasted on its own
  if(/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  return null;
}
const YT_WARNED = { file:false };
function buildYoutubeEl(node, frame, toolbar, data){
  const watchUrl = "https://www.youtube.com/watch?v=" + data.videoId;

  const wrap = document.createElement("div");
  wrap.className = "yt-wrap";
  frame.appendChild(wrap);

/* ---- Video element ---- */
function buildVideoEl(node, frame, toolbar, data){
  const video = document.createElement("video");
  video.playsInline = true; video.loop = false;
  video.draggable = false;
  video.disablePictureInPicture = true;
  video.style.pointerEvents = "none";
  if(data.blob) video.src = makeObjectUrl(data.id, data.blob);
  frame.appendChild(video);

  const shield = document.createElement("div");
  shield.className = "vid-shield";
  frame.appendChild(shield);

  /* The old bar was four 22px widgets in a row: play and mute were the same
     size, the same colour and side by side, so nobody could tell which was
     which. Play is now a big solid white disc, the speaker is a separate
     round button that unrolls its slider on hover, and the timecode sits
     between them. */
  const controls = document.createElement("div");
  controls.className = "vid-controls";
  controls.innerHTML = `
    <button class="play-btn" title="Play / pause" aria-label="Play or pause">
      <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
    </button>
    <input type="range" class="seek" min="0" max="100" value="0" step="0.1" title="Scrub" aria-label="Seek">
    <span class="vid-time">0:00 / 0:00</span>
    <div class="vid-vol-wrap">
      <button class="mute-btn" title="Mute / unmute" aria-label="Mute or unmute">
        <svg class="ic-vol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4z" fill="currentColor" stroke="none"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
        <svg class="ic-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4z" fill="currentColor" stroke="none"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
      <input type="range" class="vol" min="0" max="1" value="1" step="0.01" title="Volume" aria-label="Volume">
    </div>
  `;
  frame.appendChild(controls);

  const playBtn = el(".play-btn",controls), muteBtn = el(".mute-btn",controls);
  const seek = el(".seek",controls), vol = el(".vol",controls);
  const timeEl = el(".vid-time",controls), volWrap = el(".vid-vol-wrap",controls);
  [playBtn, muteBtn, seek, vol, volWrap].forEach(n=> n.addEventListener("pointerdown", e=>e.stopPropagation()));
  controls.addEventListener("dblclick", e=>e.stopPropagation());

  // below roughly 300px the timecode goes, and below 220px the volume too,
  // so the two buttons and the scrubber never get squashed into slivers
  const syncCompact = ()=>{
    const w = node.offsetWidth;
    node.dataset.compact = w < 230 ? "2" : (w < 330 ? "1" : "0");
  };
  node.__syncVideoCompact = syncCompact;
  syncCompact();
  if(window.ResizeObserver){
    const ro = new ResizeObserver(syncCompact);
    ro.observe(node);
  }

  const stamp = ()=>{
    const d = isFinite(video.duration) ? video.duration : 0;
    timeEl.textContent = fmtTime(video.currentTime) + " / " + fmtTime(d);
  };

  playBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    if(video.paused){ video.play().catch(()=> showToast("Couldn't play that clip")); }
    else { video.pause(); }
  });
  video.addEventListener("play",()=>{ el(".ic-play",playBtn).style.display="none"; el(".ic-pause",playBtn).style.display=""; });
  video.addEventListener("pause",()=>{ el(".ic-play",playBtn).style.display=""; el(".ic-pause",playBtn).style.display="none"; });
  muteBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    video.muted = !video.muted;
    el(".ic-vol",muteBtn).style.display = video.muted ? "none":"";
    el(".ic-mute",muteBtn).style.display = video.muted ? "":"none";
  });
  vol.addEventListener("input",()=>{ video.volume = parseFloat(vol.value); if(video.volume>0) video.muted=false; });
  video.addEventListener("loadedmetadata", stamp);
  video.addEventListener("timeupdate",()=>{
    if(video.duration) seek.value = (video.currentTime/video.duration)*100;
    stamp();
  });
  seek.addEventListener("input",()=>{
    if(video.duration) video.currentTime = (seek.value/100)*video.duration;
  });
  stamp();
}

/* ---- Sketch element ---- */
function buildSketchEl(node, frame, toolbar, data){
  const svgns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgns,"svg");
  svg.setAttribute("viewBox", `0 0 ${data.vw || data.w} ${data.vh || data.h}`);
  svg.setAttribute("preserveAspectRatio","none");
  const path = document.createElementNS(svgns,"path");
  path.setAttribute("d", data.path || "");
  // pen strokes are stored as a filled outline so they can carry pressure;
  // shapes (and any sketch made before that change) are stroked paths
  if(data.filled){
    path.setAttribute("fill", data.color || "#E4664B");
    path.setAttribute("stroke","none");
  } else {
    path.setAttribute("stroke", data.color || "#E4664B");
    path.setAttribute("stroke-width", data.strokeWidth || 3);
    path.setAttribute("fill","none");
  }
  path.setAttribute("stroke-linecap","round");
  path.setAttribute("stroke-linejoin","round");
  svg.appendChild(path);
  frame.appendChild(svg);
  node.__sketchSvg = svg;
}

/* ============================================================
   Export / import
   IndexedDB in one browser profile is a single point of failure:
   clear site data and the boards go with it. An export is a plain
   JSON file with every image, video and voice note inlined as a
   data URL, so it restores anywhere with no server involved.
=============================================================*/
function slugify(s){
  return (s||"board").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,48) || "board";
}
function blobToDataUrl(blob){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = ()=> reject(r.error);
    r.readAsDataURL(blob);
  });
}
async function serializeProject(p){
  const out = {
    name: p.name, updatedAt: p.updatedAt,
    camera: p.camera || {x:0,y:0,scale:1},
    connectors: (p.connectors||[]).map(c=>({id:c.id, a:c.a, b:c.b})),
    elements: []
  };
  for(const d of (p.elements||[])){
    const c = {};
    for(const k in d){
      if(k === "blob"){
        if(d.blob instanceof Blob){
          c.blobData = await blobToDataUrl(d.blob);
          // keep the original file type, so an .mp3 comes back as an .mp3
          c.blobType = d.blob.type || "";
        }
      } else c[k] = d[k];
    }
    out.elements.push(c);
  }
  return out;
}
async function deserializeProject(raw){
  const p = {
    id: uid(),
    name: raw.name || "Imported board",
    updatedAt: Date.now(),
    camera: raw.camera || {x:0,y:0,scale:1},
    connectors: [],
    elements: []
  };
  const idMap = {};
  for(const d of (raw.elements||[])){
    const c = {};
    for(const k in d){ if(k !== "blobData" && k !== "blobType") c[k] = d[k]; }
    idMap[d.id] = uid();
    c.id = idMap[d.id];
    if(d.blobData){
      // fetch() on a data: URL never touches the network
      try{ c.blob = await (await fetch(d.blobData)).blob(); }catch(err){ /* drop unreadable media */ }
    }
    p.elements.push(c);
  }
  (raw.connectors||[]).forEach(cn=>{
    if(idMap[cn.a] && idMap[cn.b]) p.connectors.push({id:uid(), a:idMap[cn.a], b:idMap[cn.b]});
  });
  return p;
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(err){} }, 5000);
}
async function exportBoards(all){
  const list = all ? projects.slice() : [currentProject()];
  if(!list.length || !list[0]) return;
  showToast(all ? "Packing up every board…" : "Packing up this board…");
  try{
    const payload = { muse:1, exportedAt:new Date().toISOString(), projects:[] };
    for(const p of list) payload.projects.push(await serializeProject(p));
    const name = all ? "muse-all-boards" : slugify(list[0].name);
    downloadBlob(new Blob([JSON.stringify(payload)], {type:"application/json"}), name + ".muse.json");
    showToast(all ? "Exported " + list.length + " boards" : "Exported this board");
  }catch(err){
    console.warn("export failed", err);
    showToast("Export failed — the board may be too large for one file");
  }
}
async function importBoards(file){
  try{
    const raw = JSON.parse(await file.text());
    const list = Array.isArray(raw) ? raw : (raw.projects || [raw]);
    if(!list.length || !list[0] || !("elements" in list[0])){
      showToast("That file isn't a Muse export");
      return;
    }
    showToast("Unpacking…");
    pushHistory();
    const made = [];
    for(const r of list){
      const p = await deserializeProject(r);
      projects.unshift(p);
      await dbPut(p);
      made.push(p);
    }
    renderSidebar();
    switchProject(made[0].id);
    showToast(made.length === 1 ? "Board imported" : made.length + " boards imported");
  }catch(err){
    console.warn("import failed", err);
    showToast("Couldn't read that file");
  }
}

/* ============================================================
   Colour palette extraction
=============================================================*/
function rgbToHex(r,g,b){
  const h = n=> Math.max(0,Math.min(255,Math.round(n))).toString(16).padStart(2,"0");
  return "#" + h(r) + h(g) + h(b);
}
function hexLuma(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex||""));
  if(!m) return 0.5;
  const n = parseInt(m[1],16);
  const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return (0.299*r + 0.587*g + 0.114*b)/255;
}
/* Buckets every pixel into a coarse RGB grid, then walks the buckets
   from most to least common, skipping anything too close to a colour
   already picked. Cheap, and it gives a spread rather than six shades
   of the same brown. */
function samplePalette(img, count){
  const S = 90;
  const ratio = (img.naturalHeight || 1) / (img.naturalWidth || 1);
  const c = document.createElement("canvas");
  c.width = S;
  c.height = Math.max(1, Math.round(S * ratio));
  const ctx = c.getContext("2d", {willReadFrequently:true});
  ctx.drawImage(img, 0, 0, c.width, c.height);
  const px = ctx.getImageData(0, 0, c.width, c.height).data;   // throws if cross-origin
  const bins = new Map();
  for(let i=0; i<px.length; i+=4){
    if(px[i+3] < 125) continue;
    const r=px[i], g=px[i+1], b=px[i+2];
    const key = ((r>>4)<<8) | ((g>>4)<<4) | (b>>4);
    let e = bins.get(key);
    if(!e){ e = {n:0, r:0, g:0, b:0}; bins.set(key, e); }
    e.n++; e.r+=r; e.g+=g; e.b+=b;
  }
  const list = Array.from(bins.values())
    .map(e=>({ n:e.n, r:e.r/e.n, g:e.g/e.n, b:e.b/e.n }))
    .sort((a,b)=> b.n - a.n);
  const out = [];
  for(const e of list){
    if(out.length >= count) break;
    if(out.some(o=> Math.hypot(o.r-e.r, o.g-e.g, o.b-e.b) < 52)) continue;
    out.push(e);
  }
  for(const e of list){            // top up if the image is very flat
    if(out.length >= count) break;
    if(!out.includes(e)) out.push(e);
  }
  return out.map(e=> rgbToHex(e.r, e.g, e.b));
}
function extractPalette(node, data){
  const img = node.__imgEl;
  if(!img || !img.naturalWidth){ showToast("That image hasn't finished loading"); return; }
  let colors;
  try{
    colors = samplePalette(img, 6);
  }catch(err){
    showToast("This image is served from another site, so its colours can't be read. Save it and drop the file in.");
    return;
  }
  if(!colors.length){ showToast("Couldn't find any colours in that one"); return; }
  const d = getElData(data.id) || data;
  const pal = {
    id: uid(), type:"palette",
    x: d.x, y: d.y + d.h + 20,
    w: Math.max(260, Math.min(440, d.w)), h: 88,
    colors
  };
  addElementData(pal);
  selectOnly(pal.id);
  showToast("Palette dropped below the image");
}
function buildPaletteEl(node, frame, toolbar, data){
  const grip = document.createElement("div");
  grip.className = "pal-grip";
  grip.title = "Drag to move";
  frame.appendChild(grip);

  const strip = document.createElement("div");
  strip.className = "pal-strip";
  (data.colors||[]).forEach(hex=>{
    const sw = document.createElement("div");
    sw.className = "pal-sw";
    sw.style.background = hex;
    sw.title = hex + " — click to copy, drag to move";
    const label = document.createElement("span");
    label.textContent = hex.toUpperCase();
    if(hexLuma(hex) > 0.62) label.style.color = "#1a1710";
    sw.appendChild(label);
    // A swatch no longer eats the press. The card drags from anywhere on it,
    // and the copy only fires if the pointer stayed put.
    sw.addEventListener("pointerdown",(e)=>{
      if(tool === "sketch") return;
      sw.__from = {x:e.clientX, y:e.clientY};
    });
    sw.addEventListener("click",(e)=>{
      if(tool === "sketch") return;
      e.stopPropagation();
      const f = sw.__from;
      sw.__from = null;
      if(f && Math.hypot(e.clientX-f.x, e.clientY-f.y) > 4) return;   // that was a drag
      copyText(hex.toUpperCase());
    });
    strip.appendChild(sw);
  });
  frame.appendChild(strip);
}
/* Inner controls swallow a press so it doesn't turn into an element drag.
   While sketching, though, the press belongs to the canvas: otherwise a
   stroke started over a palette or a voice note silently never happens. */
function stopUnlessDrawing(e){
  if(tool === "sketch") return;
  e.stopPropagation();
}
function copyText(text){
  const done = ()=> showToast("Copied " + text);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, ()=> fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    done();
  }catch(err){ showToast(text); }
}

/* ============================================================
   Voice notes
=============================================================*/
let recorder = null, recChunks = [], recStartedAt = 0, recTick = null;
const recChip = el("#rec-chip"), recTimeEl = el("#rec-time");
function fmtTime(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return m + ":" + String(s).padStart(2,"0");
}
async function toggleRecording(){
  if(recorder){ try{ recorder.stop(); }catch(err){} return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){
    showToast("This browser can't record audio");
    return;
  }
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(err){
    showToast("Couldn't reach the microphone");
    return;
  }
  recChunks = [];
  try{
    recorder = new MediaRecorder(stream);
  }catch(err){
    stream.getTracks().forEach(t=>t.stop());
    showToast("Recording isn't supported here");
    return;
  }
  recorder.ondataavailable = (e)=>{ if(e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop = ()=>{
    stream.getTracks().forEach(t=>t.stop());
    const secs = (Date.now() - recStartedAt)/1000;
    const blob = new Blob(recChunks, {type: (recorder && recorder.mimeType) || "audio/webm"});
    recorder = null;
    recChunks = [];
    stopRecUI();
    if(blob.size > 256) addVoiceNote(blob, secs);
    else showToast("That recording was too short to keep");
  };
  recorder.start();
  recStartedAt = Date.now();
  startRecUI();
}
function startRecUI(){
  recChip.classList.add("show");
  el("#add-voice").classList.add("active");
  recTimeEl.textContent = "0:00";
  clearInterval(recTick);
  recTick = setInterval(()=>{
    recTimeEl.textContent = fmtTime((Date.now()-recStartedAt)/1000);
  }, 300);
}
function stopRecUI(){
  clearInterval(recTick); recTick = null;
  recChip.classList.remove("show");
  el("#add-voice").classList.remove("active");
}
function addVoiceNote(blob, seconds){
  const pos = centerViewWorld();
  const data = {
    id: uid(), type:"audio",
    x: pos.x-180, y: pos.y-42, w: 360, h: 84,
    blob, duration: seconds,
    label: "Voice note " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})
  };
  addElementData(data);
  selectOnly(data.id);
  showToast("Voice note added");
}
function buildAudioEl(node, frame, toolbar, data){
  const audio = document.createElement("audio");
  audio.preload = "metadata";
  if(data.blob) audio.src = makeObjectUrl(data.id, data.blob);
  frame.appendChild(audio);

  const ui = document.createElement("div");
  ui.className = "aud-ui";
  ui.innerHTML =
    '<button class="aud-play" title="Play / pause">' +
      '<svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>' +
      '<svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>' +
    '</button>' +
    '<div class="aud-mid">' +
      '<div class="aud-label" spellcheck="false"></div>' +
      '<div class="aud-row"><input type="range" class="aud-seek" min="0" max="100" value="0" step="0.1" title="Scrub">' +
      '<span class="aud-time">0:00</span>' +
      '<span class="aud-vol-wrap">' +
        '<button class="aud-mute" title="Mute / unmute">' +
          '<svg class="ic-vol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4z" fill="currentColor" stroke="none"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>' +
          '<svg class="ic-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4z" fill="currentColor" stroke="none"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>' +
        '</button>' +
        '<input type="range" class="aud-vol" min="0" max="1" value="1" step="0.01" title="Volume">' +
      '</span>' +
      '</div>' +
    '</div>';
  frame.appendChild(ui);

  const playBtn = el(".aud-play", ui), seek = el(".aud-seek", ui);
  const timeEl = el(".aud-time", ui), labelEl = el(".aud-label", ui);
  const muteBtn = el(".aud-mute", ui), volInput = el(".aud-vol", ui), volWrap = el(".aud-vol-wrap", ui);
  labelEl.textContent = data.label || "Voice note";

  // the card remembers its level, so a quiet clip stays quiet after a reload
  audio.volume = (data.volume == null ? 1 : data.volume);
  audio.muted = !!data.muted;
  volInput.value = audio.volume;
  const paintMute = ()=>{
    const off = audio.muted || audio.volume === 0;
    el(".ic-vol", muteBtn).style.display = off ? "none" : "";
    el(".ic-mute", muteBtn).style.display = off ? "" : "none";
  };
  paintMute();

  muteBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    audio.muted = !audio.muted;
    data.muted = audio.muted;
    paintMute();
    scheduleSave();
  });
  volInput.addEventListener("input",()=>{
    audio.volume = parseFloat(volInput.value);
    if(audio.volume > 0) audio.muted = false;
    data.volume = audio.volume;
    data.muted = audio.muted;
    paintMute();
  });
  volInput.addEventListener("change",()=> scheduleSave());

  // a wide card just shows the slider; a narrow one drops the countdown first
  const syncAudioFit = ()=>{
    const w = node.offsetWidth;
    node.dataset.wide = w >= 340 ? "1" : "0";
    node.dataset.narrow = w < 250 ? "1" : "0";
  };
  node.__syncAudioFit = syncAudioFit;
  syncAudioFit();
  if(window.ResizeObserver) new ResizeObserver(syncAudioFit).observe(node);

  const total = ()=> (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : (data.duration || 0);

  // Only the two real controls swallow a press. The label used to as well,
  // which made most of the card dead: the first press did nothing and you
  // had to find a gap before it would move.
  [playBtn, seek, muteBtn, volInput, volWrap].forEach(n=> n.addEventListener("pointerdown", stopUnlessDrawing));
  ui.addEventListener("dblclick", e=> e.stopPropagation());

  playBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    if(audio.paused) audio.play().catch(()=> showToast("Couldn't play that clip"));
    else audio.pause();
  });
  audio.addEventListener("play",()=>{ el(".ic-play",playBtn).style.display="none"; el(".ic-pause",playBtn).style.display=""; });
  audio.addEventListener("pause",()=>{ el(".ic-play",playBtn).style.display=""; el(".ic-pause",playBtn).style.display="none"; });
  audio.addEventListener("ended",()=>{ seek.value = 0; timeEl.textContent = fmtTime(total()); });
  audio.addEventListener("timeupdate",()=>{
    const t = total();
    if(t) seek.value = (audio.currentTime/t)*100;
    timeEl.textContent = fmtTime(t - audio.currentTime);
  });
  audio.addEventListener("loadedmetadata",()=>{ timeEl.textContent = fmtTime(total()); });
  timeEl.textContent = fmtTime(total());
  seek.addEventListener("input",()=>{
    const t = total();
    if(t) audio.currentTime = (seek.value/100)*t;
  });

  // once it's in rename mode the label keeps the press, so you can put a
  // caret in the middle of the text instead of dragging the card
  labelEl.addEventListener("pointerdown",(e)=>{
    if(labelEl.getAttribute("contenteditable") === "true") e.stopPropagation();
  });

  // rename the note by double-clicking its label
  labelEl.addEventListener("dblclick",(e)=>{
    e.stopPropagation();
    pushHistory();
    labelEl.setAttribute("contenteditable","true");
    labelEl.focus();
    selectAllText(labelEl);
  });
  labelEl.addEventListener("keydown",(e)=>{
    e.stopPropagation();
    if(e.key === "Enter"){ e.preventDefault(); labelEl.blur(); }
  });
  labelEl.addEventListener("blur",()=>{
    labelEl.removeAttribute("contenteditable");
    data.label = labelEl.textContent.trim() || "Voice note";
    labelEl.textContent = data.label;
    scheduleSave();
    scheduleMarkers();
  });
}

/* ============================================================
   Sections (named frames)
   The body is click-through so a section can sit under a pile of
   references; you move it by the title tab, and it carries whatever
   is sitting inside it (see collectFrameCargo).
=============================================================*/
function addSectionElement(){
  const c = centerViewWorld();
  const data = { id:uid(), type:"section", x:c.x-260, y:c.y-180, w:520, h:360, title:"Section" };
  addElementData(data);
  sendToBack(data.id);
  selectOnly(data.id);
  const n = document.getElementById(data.id);
  const t = n && el(".section-title", n);
  // naming it right after you make it is the one moment a rename is expected.
  // It goes through the same path as the pencil, so it always ends cleanly.
  if(t) setTimeout(()=> startSectionRename(t), 30);
}
function buildSectionEl(node, frame, toolbar, data){
  // every side of the border moves the section, not just the title tab —
  // otherwise a section that ends up under its own contents is stuck
  ["t","r","b","l"].forEach(side=>{
    const edge = document.createElement("div");
    edge.className = "section-edge se-" + side;
    edge.title = "Drag to move the section";
    frame.appendChild(edge);
  });

  const title = document.createElement("div");
  title.className = "section-title";
  title.spellcheck = false;
  const label = document.createElement("span");
  label.className = "st-text";
  label.textContent = data.title || "Section";
  title.innerHTML =
    '<span class="st-grip"><svg viewBox="0 0 10 16" aria-hidden="true">' +
      '<circle cx="2.2" cy="2.6" r="1.35"/><circle cx="7.8" cy="2.6" r="1.35"/>' +
      '<circle cx="2.2" cy="8" r="1.35"/><circle cx="7.8" cy="8" r="1.35"/>' +
      '<circle cx="2.2" cy="13.4" r="1.35"/><circle cx="7.8" cy="13.4" r="1.35"/>' +
    '</svg></span>';
  title.appendChild(label);
  frame.appendChild(title);

  // The tab is a grab handle, nothing else. It used to double as the rename
  // control, so reaching for it to move the section kept opening an editor
  // instead. Renaming is the pencil in the toolbar (or F2).
  title.addEventListener("keydown",(e)=>{
    e.stopPropagation();
    if(e.key === "Enter"){ e.preventDefault(); label.blur(); }
    if(e.key === "Escape"){ label.textContent = data.title || "Section"; label.blur(); }
  });
  label.addEventListener("blur",()=>{
    label.removeAttribute("contenteditable");
    title.classList.remove("renaming");
    data.title = label.textContent.trim() || "Section";
    label.textContent = data.title;
    scheduleSave();
    scheduleMarkers();
    renderSidebar();
  });
  title.title = "Drag to move the section";
  // while it's being renamed the tab keeps the press, so you can place a
  // caret instead of dragging the whole section
  title.addEventListener("pointerdown",(e)=>{
    if(title.classList.contains("renaming")) e.stopPropagation();
  });
  node.__renameSection = ()=> startSectionRename(title);

  // an explicit rename button: double-clicking a small label is not a
  // discoverable way to find out that a section can be renamed at all
  const ren = document.createElement("button");
  ren.title = "Rename section";
  ren.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5l4 4L8 20H4v-4L16.5 3.5z"/></svg>';
  ren.addEventListener("click",(e)=>{ e.stopPropagation(); startSectionRename(title); });
  toolbar.appendChild(ren);
}
function startSectionRename(title){
  const label = el(".st-text", title) || title;
  pushHistory();
  title.classList.add("renaming");
  label.setAttribute("contenteditable","true");
  label.focus();
  selectAllText(label);
}

/* ============================================================
   Tags
=============================================================*/
const TAG_COLORS = ["#E4664B","#F2C14E","#5FA8A0","#8C8CE0","#7FB069","#D98CB3"];
const tagFilter = new Set();

function addTagButton(toolbar, data){
  const btn = document.createElement("button");
  btn.title = "Tag";
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12.5V5a2 2 0 0 1 2-2h7.5L21 11.5 12.5 20 3 12.5z"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/></svg>';
  btn.addEventListener("click",(e)=>{
    e.stopPropagation();
    const frame = toolbar.closest(".el-frame");
    togglePopover(frame, "tag", (pop)=>{
      pop.classList.add("text-pop");
      pop.innerHTML = '<div class="ap-label">Tag</div><div class="tp-swatches" data-row="tag"></div>';
      const row = el('[data-row="tag"]', pop);
      const none = document.createElement("button");
      none.className = "none" + (data.tag ? "" : " on");
      none.textContent = "×";
      none.title = "No tag";
      none.addEventListener("click",(e2)=>{ e2.stopPropagation(); setTag(data, null); pop.remove(); });
      row.appendChild(none);
      TAG_COLORS.forEach(c=>{
        const b = document.createElement("button");
        b.style.background = c;
        if(data.tag === c) b.classList.add("on");
        b.addEventListener("click",(e2)=>{ e2.stopPropagation(); setTag(data, c); pop.remove(); });
        row.appendChild(b);
      });
    });
  });
  toolbar.appendChild(btn);
}
function setTag(data, color){
  pushHistory();
  data.tag = color;
  applyTagLook(data);
  renderTagFilter();
  applyTagFilter();
  scheduleSave();
  showToast(color
    ? "Tagged. The stripe marks it, and the Tags row up top filters by colour."
    : "Tag removed");
}
function applyTagLook(data){
  const n = document.getElementById(data.id);
  if(!n) return;
  n.classList.toggle("tagged", !!data.tag);
  const dot = el(".tag-stripe", n);
  if(dot) dot.style.background = data.tag || "transparent";
}
function renderTagFilter(){
  const bar = el("#tag-filter");
  if(!bar) return;
  const p = currentProject();
  const used = [];
  (p && p.elements || []).forEach(d=>{ if(d.tag && !used.includes(d.tag)) used.push(d.tag); });
  bar.innerHTML = "";
  Array.from(tagFilter).forEach(c=>{ if(!used.includes(c)) tagFilter.delete(c); });
  if(!used.length) return;
  const label = document.createElement("span");
  label.className = "tf-label";
  label.textContent = "Tags";
  bar.appendChild(label);
  TAG_COLORS.filter(c=> used.includes(c)).forEach(c=>{
    const b = document.createElement("button");
    b.style.background = c;
    if(tagFilter.has(c)) b.classList.add("on");
    b.title = "Show only this tag";
    b.addEventListener("click",()=>{
      if(tagFilter.has(c)) tagFilter.delete(c); else tagFilter.add(c);
      renderTagFilter(); applyTagFilter();
      // filtering used to leave the camera where it was, so if the tagged
      // items were off-screen the board just went blank. Go to them.
      if(tagFilter.size) flyToTagged(); else fitToScreen();
    });
    bar.appendChild(b);
  });
  if(tagFilter.size){
    const clear = document.createElement("button");
    clear.className = "tf-clear";
    clear.textContent = "show all";
    clear.title = "Drop the filter and fit the whole board back on screen";
    clear.addEventListener("click",()=>{
      tagFilter.clear();
      renderTagFilter();
      applyTagFilter();
      fitToScreen();
    });
    bar.appendChild(clear);
  }
}
/* centre whatever the active tag filter is showing */
function flyToTagged(){
  const p = currentProject();
  const hits = (p && p.elements || []).filter(d=> d.tag && tagFilter.has(d.tag));
  if(!hits.length){ showToast("Nothing carries that tag any more"); return; }
  flyToRect(rectOfMany(hits));
}
function applyTagFilter(){
  const on = tagFilter.size > 0;
  els(".el", layer).forEach(n=>{
    if(!on){ n.classList.remove("dimmed"); return; }
    const d = getElData(n.id);
    n.classList.toggle("dimmed", !(d && d.tag && tagFilter.has(d.tag)));
  });
}

/* ============================================================
   Cross-board text search
   The sidebar used to match project names only, so a note typed
   weeks ago was effectively gone. This searches note text and
   section titles on every board and flies you to the hit.
=============================================================*/
function searchableText(d){
  if(d.type === "text") return d.text || "";
  if(d.type === "section") return d.title || "";
  if(d.type === "audio") return d.label || "";
  return "";
}
function elementSearchHits(q){
  if(q.length < 2) return [];
  const hits = [];
  projects.forEach(p=>{
    (p.elements||[]).forEach(d=>{
      const hay = searchableText(d);
      if(hay && hay.toLowerCase().includes(q)) hits.push({projectId:p.id, projectName:p.name, id:d.id, text:hay.trim().replace(/\s+/g," ")});
    });
  });
  return hits.slice(0, 40);
}
function goToElement(projectId, elementId){
  const jump = ()=>{
    const d = getElData(elementId);
    if(!d){ showToast("That note has since been deleted"); return; }
    if(tool !== "select") setTool("select");
    flyToRect({x:d.x, y:d.y, w:d.w, h:d.h}, ()=> selectOnly(elementId));
  };
  if(projectId !== currentId){
    switchProject(projectId);
    setTimeout(jump, 60);
  } else jump();
}

/* ============================================================
   Selection
=============================================================*/
function selectOnly(id){ selection.clear(); selection.add(id); updateSelectionUI(); }
function toggleSelect(id){ if(selection.has(id)) selection.delete(id); else selection.add(id); updateSelectionUI(); }
function clearSelection(){ selection.clear(); updateSelectionUI(); }

function updateSelectionUI(){
  els(".el",layer).forEach(n=> n.classList.toggle("selected", selection.has(n.id)));
  // a popover belongs to one element: deselect it and the panel goes too,
  // instead of hanging around while you work on something else
  els(".adjust-pop", layer).forEach(p=>{
    const host = p.closest(".el");
    if(!host || !selection.has(host.id) || selection.size !== 1) p.remove();
  });
  if(selection.size >= 2){
    const box = getSelectionBBox();
    groupBox.style.display = "block";
    groupBox.style.left = box.x+"px"; groupBox.style.top = box.y+"px";
    groupBox.style.width = box.w+"px"; groupBox.style.height = box.h+"px";
    els(".el > .el-frame > .resize-handle", layer).forEach(h=> h.style.display="none");
  } else {
    groupBox.style.display = "none";
    // this inline "none" was never cleared before, which left a single
    // selected element with no usable resize handles after a multi-select
    els(".el > .el-frame > .resize-handle", layer).forEach(h=> h.style.display="");
  }
  syncToolbarFlip();
}
/* keep a selected element's toolbar out from under the title row */
function syncToolbarFlip(){
  if(!selection.size) return;
  const r = stage.getBoundingClientRect();
  selection.forEach(id=>{
    const n = document.getElementById(id);
    if(!n) return;
    const b = n.getBoundingClientRect();
    n.classList.toggle("tb-below", (b.top - r.top) < 54);
  });
}
function getSelectionBBox(){
  const p = currentProject();
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  selection.forEach(id=>{
    const d = getElData(id); if(!d) return;
    minX=Math.min(minX,d.x); minY=Math.min(minY,d.y);
    maxX=Math.max(maxX,d.x+d.w); maxY=Math.max(maxY,d.y+d.h);
  });
  return {x:minX,y:minY,w:maxX-minX,h:maxY-minY};
}

/* ============================================================
   Element interaction: drag / resize
=============================================================*/
function bindElementInteraction(node, data){
  node.addEventListener("pointerdown",(e)=>{
    // sketching passes straight through to the stage so you can draw OVER an element
    if(tool === "sketch") return;
    // the toolbar owns the open/close of its own panels, so leave it alone
    if(e.target.closest(".el-toolbar")) return;
    // anything else you touch puts an open panel away
    if(!e.target.closest(".adjust-pop")) closePopovers();
    if(e.target.closest(".vid-controls")) return;

    // a crop / annotate session owns this element: no dragging, no resizing,
    // and the overlay's own handles are the only ones that respond
    if(node.classList.contains("tool-active")){
      if(!e.target.closest(".tool-overlay") && !e.target.closest(".annotate-canvas")
         && !e.target.closest(".tool-actions") && !e.target.closest(".annotate-colors")){
        e.stopPropagation();
      }
      return;
    }

    // an adjust popover is open: let its own controls handle the press
    if(e.target.closest(".adjust-pop")) return;

    if(e.target.closest(".resize-handle")){
      if(data.locked) return;
      e.stopPropagation();
      startResize(e, node, data, e.target.dataset.h, true);
      return;
    }

    if(node.__editing) return;

    if(tool === "connect"){
      e.stopPropagation();
      handleConnectClick(data.id);
      return;
    }

    e.stopPropagation();
    const alreadySoleSelection = selection.has(data.id) && selection.size===1;
    if(e.shiftKey){
      toggleSelect(data.id);
    } else if(!selection.has(data.id)){
      selectOnly(data.id);
    }
    // a locked element can be selected (so you can unlock it) but never moved
    if(data.locked) return;
    // a section is a backdrop: raising it on every drag would put its dashed
    // border over the very references it's meant to sit behind
    if(data.type !== "section") bringToFront(data.id);
    const allowReEdit = data.type==="text" && alreadySoleSelection && !e.shiftKey;
    startDrag(e, data.id, allowReEdit);
  });

  // double-click is a reliable, immediate way into text editing too
  if(data.type === "text"){
    node.addEventListener("dblclick",(e)=>{
      if(e.target.closest(".el-toolbar")||e.target.closest(".resize-handle")) return;
      const txt = el(".txt",node);
      if(txt) enterTextEdit(node, txt, data);
    });
  }
}

function startDrag(e, clickedId, allowReEditOnPlainClick){
  const preState = snapshotState();
  const startWorld = screenToWorld(e.clientX, e.clientY);
  // locked elements never travel, even as part of a group drag
  let ids = (selection.size ? Array.from(selection) : [clickedId])
              .filter(id=>{ const d = getElData(id); return d && !d.locked; });
  if(!ids.length) ids = [];
  const starts = {};
  ids.forEach(id=>{ const d=getElData(id); if(d) starts[id] = {x:d.x, y:d.y}; });
  // a frame carries whatever is sitting inside it
  const frameCargo = collectFrameCargo(ids);
  frameCargo.forEach(id=>{ const d=getElData(id); if(d && !starts[id]) starts[id] = {x:d.x, y:d.y}; });
  const moveIds = ids.concat(frameCargo.filter(id=> !ids.includes(id)));
  let moved=false;
  const shiftHeld = !!e.shiftKey;
  const hadMultiSelection = selection.size > 1;
  const release = capturePointer(e);
  beginGesture();

  function move(ev){
    if(pinch) return;
    const w = screenToWorld(ev.clientX, ev.clientY);
    let dx = w.x - startWorld.x, dy = w.y - startWorld.y;
    if(!moved && (Math.abs(dx)+Math.abs(dy) > 2)){
      moved = true;
      document.getElementById(clickedId)?.classList.add("dragging");
    }

    // alignment snapping: only for a single dragged element, and only when
    // the user isn't holding alt (the usual "let me place it freely" escape)
    if(moved && ids.length === 1 && !ev.altKey){
      const s = starts[ids[0]], d = getElData(ids[0]);
      if(s && d){
        const snap = computeSnap(ids[0], s.x+dx, s.y+dy, d.w, d.h);
        dx += snap.dx; dy += snap.dy;
        drawGuides(snap.guides);
      }
    } else {
      drawGuides([]);
    }

    moveIds.forEach(id=>{
      const d = getElData(id); const s = starts[id];
      if(!d || !s) return;
      d.x = s.x+dx; d.y = s.y+dy;
      const node = document.getElementById(id);
      if(node){ node.style.left = d.x+"px"; node.style.top = d.y+"px"; }
    });
    if(ids.length>1) updateSelectionUI();
    renderConnectors();
    scheduleMarkers();
  }
  function up(){
    window.removeEventListener("pointermove",move);
    window.removeEventListener("pointerup",up);
    window.removeEventListener("pointercancel",up);
    release(); endGesture();
    drawGuides([]);
    els(".dragging",layer).forEach(n=>n.classList.remove("dragging"));
    if(moved){
      scheduleSave();
      commitHistory(preState);
    } else if(!shiftHeld && hadMultiSelection && clickedId && selection.has(clickedId)){
      // a plain click inside a group selection collapses to just that element.
      // Without this the group box stayed up and the element's own resize
      // handles remained hidden, with no obvious way back.
      selectOnly(clickedId);
    } else if(allowReEditOnPlainClick){
      const d = getElData(clickedId);
      const n = document.getElementById(clickedId);
      const txt = n && el(".txt",n);
      if(d && txt && !n.__editing) enterTextEdit(n, txt, d);
    }
  }
  window.addEventListener("pointermove",move);
  window.addEventListener("pointerup",up);
  window.addEventListener("pointercancel",up);
}

function startResize(e, node, data, handle, isSingle){
  const preState = snapshotState();
  let resized = false;
  const release = capturePointer(e);
  beginGesture();
  const ids = selection.size>1 ? Array.from(selection) : [data.id];
  const group = ids.length>1;
  const bbox = group ? getSelectionBBox() : {x:data.x,y:data.y,w:data.w,h:data.h};
  const starts = {};
  ids.forEach(id=>{ const d=getElData(id); starts[id]={x:d.x,y:d.y,w:d.w,h:d.h, fontSize:d.fontSize}; });
  const startWorld = screenToWorld(e.clientX,e.clientY);
  document.getElementById(data.id)?.classList.add("resizing");

  // a rotated card is resized in its own frame of reference, and about its
  // centre, so the corner you grabbed still moves the way you pushed it
  const rot = (!group && data && data.rot) ? normRot(data.rot) : 0;

  function move(ev){
    if(pinch) return;
    resized = true;
    const w = screenToWorld(ev.clientX, ev.clientY);
    let dx = w.x-startWorld.x, dy = w.y-startWorld.y;
    if(rot){
      const a = -rot * Math.PI/180;
      const rx = dx*Math.cos(a) - dy*Math.sin(a);
      const ry = dx*Math.sin(a) + dy*Math.cos(a);
      dx = rx; dy = ry;
    }
    let nx=bbox.x, ny=bbox.y, nw=bbox.w, nh=bbox.h;
    if(ev.shiftKey || rot){
      // hold shift and the box grows from its centre: every side moves at
      // once, so a circle stays put instead of walking across the board
      const cx = bbox.x + bbox.w/2, cy = bbox.y + bbox.h/2;
      let gx = 0, gy = 0;
      if(handle.includes("e")) gx = dx;
      if(handle.includes("w")) gx = -dx;
      if(handle.includes("s")) gy = dy;
      if(handle.includes("n")) gy = -dy;
      if(handle.includes("e") || handle.includes("w")) nw = Math.max(24, bbox.w + gx*2);
      if(handle.includes("n") || handle.includes("s")) nh = Math.max(24, bbox.h + gy*2);
      nx = cx - nw/2;
      ny = cy - nh/2;
    } else {
      if(handle.includes("e")) nw = Math.max(24, bbox.w+dx);
      if(handle.includes("s")) nh = Math.max(24, bbox.h+dy);
      if(handle.includes("w")){ nw = Math.max(24, bbox.w-dx); nx = bbox.x+bbox.w-nw; }
      if(handle.includes("n")){ nh = Math.max(24, bbox.h-dy); ny = bbox.y+bbox.h-nh; }
    }
    const sx = nw/bbox.w, sy = nh/bbox.h;
    ids.forEach(id=>{
      const d = getElData(id); const s = starts[id];
      d.x = nx + (s.x-bbox.x)*sx;
      d.y = ny + (s.y-bbox.y)*sy;
      d.w = Math.max(24, s.w*sx);
      d.h = Math.max(20, s.h*sy);
      if(d.fontSize) d.fontSize = Math.max(8, s.fontSize*((sx+sy)/2));
      applyElRect(id,d);
    });
    if(group) updateSelectionUI();
    renderConnectors();
    scheduleMarkers();
  }
  function up(){
    window.removeEventListener("pointermove",move);
    window.removeEventListener("pointerup",up);
    window.removeEventListener("pointercancel",up);
    release(); endGesture();
    els(".resizing",layer).forEach(n=>n.classList.remove("resizing"));
    if(resized){
      scheduleSave();
      commitHistory(preState);
    }
  }
  window.addEventListener("pointermove",move);
  window.addEventListener("pointerup",up);
  window.addEventListener("pointercancel",up);
}

/* ============================================================
   Alignment snapping + guides
=============================================================*/
const guideLayer = el("#guide-layer");
function computeSnap(movingId, x, y, w, h){
  const tol = 7 / camera.scale;          // constant feel on screen at any zoom
  const p = currentProject();
  const mine = { l:x, cx:x+w/2, r:x+w, t:y, cy:y+h/2, b:y+h };
  let bestX = null, bestY = null;
  const guides = [];

  p.elements.forEach(d=>{
    if(d.id === movingId) return;
    const o = { l:d.x, cx:d.x+d.w/2, r:d.x+d.w, t:d.y, cy:d.y+d.h/2, b:d.y+d.h };
    [["l","l"],["l","r"],["r","l"],["r","r"],["cx","cx"]].forEach(([a,b])=>{
      const diff = o[b] - mine[a];
      if(Math.abs(diff) <= tol && (bestX === null || Math.abs(diff) < Math.abs(bestX.diff))){
        bestX = { diff, at:o[b], a, o:d };
      }
    });
    [["t","t"],["t","b"],["b","t"],["b","b"],["cy","cy"]].forEach(([a,b])=>{
      const diff = o[b] - mine[a];
      if(Math.abs(diff) <= tol && (bestY === null || Math.abs(diff) < Math.abs(bestY.diff))){
        bestY = { diff, at:o[b], a, o:d };
      }
    });
  });

  const dx = bestX ? bestX.diff : 0;
  const dy = bestY ? bestY.diff : 0;
  if(bestX){
    const o = bestX.o;
    guides.push({ vertical:true, at:bestX.at,
      from: Math.min(y+dy, o.y), to: Math.max(y+h+dy, o.y+o.h) });
  }
  if(bestY){
    const o = bestY.o;
    guides.push({ vertical:false, at:bestY.at,
      from: Math.min(x+dx, o.x), to: Math.max(x+w+dx, o.x+o.w) });
  }
  return { dx, dy, guides };
}

function drawGuides(guides){
  if(!guideLayer) return;
  if(!guides || !guides.length){ guideLayer.innerHTML = ""; return; }
  guideLayer.innerHTML = guides.map(g=>{
    if(g.vertical){
      return `<line class="guide-line" x1="${g.at+4500}" y1="${g.from+4500-20}" x2="${g.at+4500}" y2="${g.to+4500+20}"/>`;
    }
    return `<line class="guide-line" x1="${g.from+4500-20}" y1="${g.at+4500}" x2="${g.to+4500+20}" y2="${g.at+4500}"/>`;
  }).join("");
}

/* a frame drags whatever is sitting on top of it */
function collectFrameCargo(draggedIds){
  const out = [];
  draggedIds.forEach(id=>{
    const f = getElData(id);
    if(!f || f.type !== "section") return;
    // a locked item stays put even when its section moves; that is the escape
    // hatch for taking one reference out of a locked section
    sectionContents(f, {skipLocked:true}).forEach(cid=>{
      if(draggedIds.includes(cid) || out.includes(cid)) return;
      out.push(cid);
    });
  });
  return out;
}

function applyElRect(id,d){
  const node = document.getElementById(id);
  if(!node) return;
  node.style.left=d.x+"px"; node.style.top=d.y+"px"; node.style.width=d.w+"px"; node.style.height=d.h+"px";
  applyRotation(node, d);
  if(d.type==="text"){
    const txt = el(".txt",node);
    if(txt && d.fontSize) txt.style.fontSize = d.fontSize+"px";
  }
  // sketch elements keep their original viewBox forever; the SVG (width/height:100% of the
  // box, preserveAspectRatio="none") stretches the fixed-coordinate drawing to fill the new
  // box size automatically. Rewriting the viewBox here would cancel that stretch.
}

// group-box handles drive group resize
els(".resize-handle",groupBox).forEach(rh=>{
  rh.addEventListener("pointerdown",(e)=>{
    e.stopPropagation();
    const bbox = getSelectionBBox();
    const fakeData = {id:null, x:bbox.x,y:bbox.y,w:bbox.w,h:bbox.h};
    startResize(e, null, fakeData, rh.dataset.h, false);
  });
});

/* ============================================================
   Connectors
=============================================================*/
function handleConnectClick(id){
  if(!connectFrom){
    connectFrom = id;
    document.getElementById(id).classList.add("selected");
    showToast("Now click the idea to connect it to");
    return;
  }
  if(connectFrom === id){ connectFrom=null; return; }
  pushHistory();
  const p = currentProject();
  p.connectors = p.connectors || [];
  p.connectors.push({id:uid(), a:connectFrom, b:id});
  connectFrom = null;
  renderConnectors();
  scheduleSave();
}
function renderConnectors(){
  const p = currentProject();
  connectorSvg.innerHTML = "";
  (p.connectors||[]).forEach(c=>{
    const a = getElData(c.a), b = getElData(c.b);
    if(!a||!b) return;
    const x1=a.x+a.w/2+4500, y1=a.y+a.h/2+4500, x2=b.x+b.w/2+4500, y2=b.y+b.h/2+4500;
    const g = document.createElementNS("http://www.w3.org/2000/svg","g");
    const hit = document.createElementNS("http://www.w3.org/2000/svg","line");
    hit.setAttribute("class","connector-hit");
    hit.setAttribute("x1",x1); hit.setAttribute("y1",y1); hit.setAttribute("x2",x2); hit.setAttribute("y2",y2);
    const line = document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("class","connector-line");
    line.setAttribute("x1",x1); line.setAttribute("y1",y1); line.setAttribute("x2",x2); line.setAttribute("y2",y2);
    hit.addEventListener("click",()=>{
      pushHistory();
      p.connectors = p.connectors.filter(cc=>cc.id!==c.id);
      renderConnectors(); scheduleSave();
    });
    hit.addEventListener("mouseenter",()=> line.classList.add("hovered"));
    hit.addEventListener("mouseleave",()=> line.classList.remove("hovered"));
    g.appendChild(hit); g.appendChild(line);
    connectorSvg.appendChild(g);
  });
}

/* ============================================================
   Adding elements: text / image / video / youtube
=============================================================*/
function addTextElement(worldPos, rect){
  // last line of defence: never spawn a text box mid-gesture
  if(gestureCount > 0) return;
  let x, y, w, h, fontSize;
  if(rect){
    // a box you drew: it keeps the size you gave it, and the type scales with
    // it so a big box isn't full of tiny text
    w = Math.max(70, rect.w); h = Math.max(38, rect.h);
    x = rect.x; y = rect.y;
    fontSize = Math.max(13, Math.min(72, Math.round(h * 0.3)));
  } else {
    const pos = worldPos || centerViewWorld();
    w = 220; h = 60; x = pos.x - w/2; y = pos.y - h/2; fontSize = 20;
  }
  const data = { id:uid(), type:"text", x, y, w, h, fontSize, text:"", color:null, bg:null };
  addElementData(data);
  selectOnly(data.id);
  setTimeout(()=>{
    const node = document.getElementById(data.id);
    enterTextEdit(node, el(".txt",node), data);
  },30);
}

function addImageFromFile(file, worldPos){
  const pos = worldPos || centerViewWorld();
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = ()=>{
    const maxDim = 380;
    let w = img.naturalWidth, h = img.naturalHeight;
    const scale = Math.min(1, maxDim/Math.max(w,h));
    w*=scale; h*=scale;
    const data = { id:uid(), type:"image", x:pos.x-w/2, y:pos.y-h/2, w, h, blob:file };
    addElementData(data);
    selectOnly(data.id);
    URL.revokeObjectURL(url);
  };
  // a corrupt or unsupported file must not strand its probe URL
  img.onerror = ()=>{ URL.revokeObjectURL(url); showToast("Couldn't read that image"); };
  img.src = url;
}

function addVideoFromFile(file, worldPos){
  const pos = worldPos || centerViewWorld();
  const data = { id:uid(), type:"video", x:pos.x-180, y:pos.y-110, w:360, h:220, blob:file };
  addElementData(data);
  selectOnly(data.id);
}

function addAudioFromFile(file, worldPos){
  const pos = worldPos || centerViewWorld();
  const name = (file.name || "Audio").replace(/\.[a-z0-9]+$/i, "");
  const data = {
    id: uid(), type:"audio",
    x: pos.x-180, y: pos.y-42, w: 360, h: 84,
    blob: file, duration: 0,
    label: name || "Audio"
  };
  addElementData(data);
  selectOnly(data.id);
}

/* ---- one door for every file ----
   The picker, a drop and a paste all come through here, so there is a single
   place that decides what a file becomes. MIME types are unreliable on some
   systems (an .mp3 can arrive as "" or as application/octet-stream), so the
   extension is the fallback rather than an afterthought. */
const AUDIO_EXT = /\.(mp3|m4a|aac|wav|flac|oga|opus|weba|aiff?|wma)$/i;
const VIDEO_EXT = /\.(mp4|m4v|mov|avi|mkv|webm|ogv|3gp|wmv|mpe?g)$/i;
const IMAGE_EXT = /\.(png|jpe?g|gif|webp|avif|bmp|svg|heic|heif|ico|tiff?)$/i;

function mediaKind(file){
  const type = (file.type || "").toLowerCase();
  const name = file.name || "";
  // a saved board counts as "a file someone wants to open", so it comes in
  // through the same door — the picker, a drop on the canvas, or Import
  if(/\.json$/i.test(name) || type === "application/json") return "board";
  if(type.startsWith("image/")) return "image";
  if(type.startsWith("audio/")) return "audio";
  if(type.startsWith("video/")){
    // .ogg and .webm are containers: a "video/..." wrapper may hold sound only
    return AUDIO_EXT.test(name) ? "audio" : "video";
  }
  if(AUDIO_EXT.test(name)) return "audio";
  if(VIDEO_EXT.test(name)) return "video";
  if(IMAGE_EXT.test(name)) return "image";
  if(/\.ogg$/i.test(name)) return "audio";
  return null;
}

function addMediaFile(file, worldPos){
  const kind = mediaKind(file);
  if(kind === "image") return addImageFromFile(file, worldPos);
  if(kind === "video") return addVideoFromFile(file, worldPos);
  if(kind === "audio") return addAudioFromFile(file, worldPos);
  if(kind === "board") return importBoards(file);
  showToast("That file type can't go on a board yet — images, video, audio and a saved board can");
}

function addYoutubeFromUrl(url, worldPos){
  const id = parseYouTubeId(url);
  if(!id){ showToast("That doesn't look like a YouTube link."); return; }
  const pos = worldPos || centerViewWorld();
  const data = { id:uid(), type:"youtube", x:pos.x-200, y:pos.y-112, w:400, h:225, videoId:id };
  addElementData(data);
  selectOnly(data.id);
}

/* ============================================================
   Stage-level interactions: pan, zoom, marquee, sketch, keys
=============================================================*/
let spaceHeld = false;
let panning = false, panStart=null, camStart=null;
let marqueeActive=false, marqueeStart=null;
let textDrawActive=false, textDrawStart=null, textRelease=null;
let sketchActive=false, sketchPoints=[];
let sketchColor = "#E4664B";
let sketchMode = "pen";          // pen | line | rect | ellipse | arrow | erase
let sketchWidth = 3;
let sketchShift = false;         // shift is read live, so it can be pressed mid-stroke
let eraseActive = false, erasePre = null, erasedAny = false;
let lastErasePt = null;
const erasedIds = new Set();

const sketchPanelEl = el("#sketch-panel");
const sketchColorsEl = el("#sketch-colors");
els("button", sketchColorsEl).forEach(b=>{
  b.addEventListener("click",(e)=>{
    e.stopPropagation();
    sketchColor = b.dataset.color;
    els("button", sketchColorsEl).forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
  });
});
els(".sk-modes button", sketchPanelEl).forEach(b=>{
  b.addEventListener("click",(e)=>{
    e.stopPropagation();
    sketchMode = b.dataset.mode;
    els(".sk-modes button", sketchPanelEl).forEach(x=> x.classList.remove("active"));
    b.classList.add("active");
    syncSketchMode();
  });
});
const widthInput = el("#sketch-width"), widthVal = el("#sketch-width-val");
widthInput.addEventListener("input",()=>{
  sketchWidth = parseInt(widthInput.value,10) || 3;
  widthVal.textContent = sketchWidth;
  if(tool === "sketch" && sketchMode === "erase" && lastPointerScreen)
    showEraserRing(lastPointerScreen.x, lastPointerScreen.y);
});
let lastPointerScreen = null;
function syncSketchMode(){
  const erasing = (tool === "sketch" && sketchMode === "erase");
  document.body.classList.toggle("sketch-erase", erasing);
  stage.classList.toggle("erase-mode", erasing);
  stage.classList.toggle("draw-mode", tool === "sketch" && !erasing);
  if(!erasing) hideEraserRing();
}

/* pen pressure: a mouse reports a flat 0.5, a stylus reports the real thing */
function pressureOf(e){
  if(e.pointerType === "pen" && e.pressure > 0 && e.pressure < 1) return e.pressure;
  if(e.pointerType === "touch" && e.pressure > 0 && e.pressure < 1) return e.pressure;
  return 0.5;
}

/* Drag the eraser across a stroke and the points between two pointer samples
   must be erased too, or a quick swipe leaves untouched islands behind. */
function eraseStroke(cx, cy){
  const w = screenToWorld(cx, cy);
  const r = eraserRadius();
  if(lastErasePt){
    const dist = Math.hypot(w.x-lastErasePt.x, w.y-lastErasePt.y);
    const steps = Math.min(64, Math.ceil(dist / (r*0.6)));
    for(let i=1; i<=steps; i++){
      const t = i/steps;
      eraseAtWorld(lastErasePt.x + (w.x-lastErasePt.x)*t,
                   lastErasePt.y + (w.y-lastErasePt.y)*t, r);
    }
  }
  eraseAtWorld(w.x, w.y, r);
  lastErasePt = w;
}

/* the brush outline that follows the cursor, so its size is visible */
const eraserRing = el("#eraser-ring");
function showEraserRing(cx, cy){
  const d = eraserRadius() * 2 * camera.scale;
  eraserRing.style.width = d+"px";
  eraserRing.style.height = d+"px";
  eraserRing.style.left = cx+"px";
  eraserRing.style.top = cy+"px";
  eraserRing.classList.add("show");
}
function hideEraserRing(){ eraserRing.classList.remove("show"); }

stage.addEventListener("pointerdown",(e)=>{
  // a crop / annotate session owns the pointer
  if(e.target.closest(".tool-overlay") || e.target.closest(".annotate-canvas")
     || e.target.closest(".tool-actions") || e.target.closest(".annotate-colors")) return;

  // pressing anywhere that isn't an open panel closes it
  if(!e.target.closest(".adjust-pop") && !e.target.closest(".el-toolbar")) closePopovers();

  // Sketch is checked BEFORE the element test, so you can start a stroke
  // on top of an image or a card instead of it being swallowed.
  if(tool === "sketch"){
    if(e.button !== 0) return;
    e.preventDefault();
    if(sketchMode === "erase"){
      eraseActive = true;
      erasePre = snapshotState();
      erasedAny = false;
      lastErasePt = null;
      sketchRelease = capturePointer(e);
      beginGesture();
      eraseStroke(e.clientX, e.clientY);
      return;
    }
    sketchActive = true;
    sketchRelease = capturePointer(e);
    beginGesture();
    const w = screenToWorld(e.clientX,e.clientY);
    sketchShift = !!e.shiftKey;
    sketchPoints = [{x:w.x, y:w.y, p:pressureOf(e)}];
    beginSketchPreview();
    return;
  }
