  // Text placement is checked before the element test, like sketching, so a
  // box can be drawn over a picture instead of the press being swallowed.
  if(tool === "text"){
    if(e.button !== 0) return;
    e.preventDefault();
    textDrawActive = true;
    const tr = stage.getBoundingClientRect();
    textDrawStart = {x:e.clientX-tr.left, y:e.clientY-tr.top};
    marquee.classList.add("text-draw");
    marquee.style.left = textDrawStart.x+"px"; marquee.style.top = textDrawStart.y+"px";
    marquee.style.width = "0px"; marquee.style.height = "0px";
    marquee.style.display = "block";
    textRelease = capturePointer(e);
    beginGesture();
    return;
  }

  if(e.target.closest(".el") || e.target.closest("#group-box")) return;

  if(tool === "connect"){
    connectFrom = null;
    return;
  }

  // A selected section can be dragged from any empty spot inside it, which
  // makes the whole frame a move area rather than one small tab. Anything
  // sitting in the section keeps its own clicks, because this only runs when
  // the press landed on bare canvas.
  if(tool === "select" && !spaceHeld && e.button === 0){
    const wp = screenToWorld(e.clientX, e.clientY);
    const sec = sectionAtPoint(wp.x, wp.y, true);
    if(sec && !sec.locked){
      e.stopPropagation();
      if(!selection.has(sec.id) || selection.size !== 1) selectOnly(sec.id);
      startDrag(e, sec.id, false);
      return;
    }
  }

  // on a touch screen one finger on empty canvas pans it (there is no space bar)
  if(spaceHeld || e.button === 1 || e.pointerType === "touch"){
    if(e.pointerType === "touch" && !spaceHeld) clearSelection();
    panning = true;
    panStart = {x:e.clientX,y:e.clientY};
    camStart = {...camera};
    stage.classList.add("panning");
    return;
  }
  // marquee select
  clearSelection();
  marqueeActive = true;
  const r = stage.getBoundingClientRect();
  marqueeStart = {x:e.clientX-r.left, y:e.clientY-r.top};
  marquee.style.left=marqueeStart.x+"px"; marquee.style.top=marqueeStart.y+"px";
  marquee.style.width="0px"; marquee.style.height="0px";
  marquee.style.display="block";
});

window.addEventListener("pointermove",(e)=>{
  if(pinch) return;   // two fingers down: the pinch handler owns the camera
  if(panning){
    camera.x = camStart.x + (e.clientX-panStart.x);
    camera.y = camStart.y + (e.clientY-panStart.y);
    applyCamera();
    return;
  }
  if(marqueeActive || textDrawActive){
    const r = stage.getBoundingClientRect();
    const from = textDrawActive ? textDrawStart : marqueeStart;
    const cx = e.clientX-r.left, cy = e.clientY-r.top;
    const x = Math.min(cx, from.x), y = Math.min(cy, from.y);
    const w = Math.abs(cx-from.x), h = Math.abs(cy-from.y);
    marquee.style.left=x+"px"; marquee.style.top=y+"px"; marquee.style.width=w+"px"; marquee.style.height=h+"px";
    return;
  }
  if(eraseActive){
    showEraserRing(e.clientX, e.clientY);
    eraseStroke(e.clientX, e.clientY);
    return;
  }
  if(sketchActive){
    // shift is read on every move, so it can be pressed or released
    // part-way through and the shape follows immediately
    sketchShift = !!e.shiftKey;
    // a shape (or a shift-held pen stroke) only ever needs its two ends
    if(sketchMode !== "pen" || sketchShift){
      const w = screenToWorld(e.clientX, e.clientY);
      sketchPoints = [sketchPoints[0], {x:w.x, y:w.y, p:sketchPoints[0].p}];
      updateSketchPreview();
      return;
    }
    // coalesced events recover the samples the browser batched up, so fast
    // strokes stay smooth instead of turning into straight segments
    const raw = (e.getCoalescedEvents && e.getCoalescedEvents().length)
      ? e.getCoalescedEvents() : [e];
    const minDist = 1.1 / camera.scale;   // thin out jitter, in world units
    let added = false;
    raw.forEach(ev=>{
      const w = screenToWorld(ev.clientX, ev.clientY);
      const prev = sketchPoints[sketchPoints.length-1];
      if(prev && Math.hypot(w.x-prev.x, w.y-prev.y) < minDist) return;
      sketchPoints.push({x:w.x, y:w.y, p:pressureOf(ev)});
      added = true;
    });
    if(added) updateSketchPreview();
  }
});

window.addEventListener("pointerup",(e)=>{
  if(panning){ panning=false; stage.classList.remove("panning"); saveCamera(); }
  if(textDrawActive){ finishTextDraw(); return; }
  if(marqueeActive){
    const mRect = marquee.getBoundingClientRect();
    marqueeActive=false;
    marquee.style.display="none";
    if(mRect.width>3 && mRect.height>3){
      const p1 = screenToWorld(mRect.left, mRect.top);
      const p2 = screenToWorld(mRect.right, mRect.bottom);
      const p = currentProject();
      p.elements.forEach(d=>{
        if(d.x < p2.x && d.x+d.w > p1.x && d.y < p2.y && d.y+d.h > p1.y){
          selection.add(d.id);
        }
      });
      updateSelectionUI();
    }
  }
  endSketchGesture();
});
// a cancelled pointer (browser gesture, tab switch, pen lift) must not strand the stroke
window.addEventListener("pointercancel", ()=>{ cancelTextDraw(); endSketchGesture(); });

/* A drag gives the box you drew; a plain click gives a default box exactly
   where you clicked. Either way it drops back to the select tool and opens
   for typing. */
function finishTextDraw(){
  textDrawActive = false;
  if(textRelease){ textRelease(); textRelease = null; }
  endGesture();
  const mRect = marquee.getBoundingClientRect();
  const drew = mRect.width > 24 && mRect.height > 22;
  const p1 = screenToWorld(mRect.left, mRect.top);
  const p2 = screenToWorld(mRect.right, mRect.bottom);
  marquee.style.display = "none";
  marquee.classList.remove("text-draw");
  setTool("select");
  if(drew) addTextElement(null, {x:p1.x, y:p1.y, w:p2.x-p1.x, h:p2.y-p1.y});
  else addTextElement({x:p1.x, y:p1.y});
}
function cancelTextDraw(){
  if(!textDrawActive) return;
  textDrawActive = false;
  if(textRelease){ textRelease(); textRelease = null; }
  endGesture();
  marquee.style.display = "none";
  marquee.classList.remove("text-draw");
}

function endSketchGesture(){
  if(sketchActive){
    sketchActive=false;
    if(sketchRelease){ sketchRelease(); sketchRelease=null; }
    endGesture();
    finalizeSketch();
  }
  if(eraseActive){
    eraseActive=false;
    lastErasePt = null;
    if(sketchRelease){ sketchRelease(); sketchRelease=null; }
    endGesture();
    erasedIds.forEach(trimSketch);
    erasedIds.clear();
    if(erasedAny){
      updateSelectionUI();
      renderConnectors();
      scheduleMarkers();
      if(erasePre){ commitHistory(erasePre); scheduleSave(); }
    }
    erasePre = null; erasedAny = false;
  }
}

/* ============================================================
   Sketch geometry

   A sketch is stored as RUNS of points, not as a finished path string.
   That is what lets the eraser take a bite out of a stroke instead of
   deleting the whole thing: cutting is just dropping points and splitting
   what's left. The path string is derived from the runs and cached.

   Runs live in the element's own viewBox coordinates (vw x vh), which the
   SVG then stretches to the element's current w x h. So a resized sketch
   keeps working: world coordinates are mapped back through that scale.
=============================================================*/

/* Light moving average over the centre line, so the wobble of a fast
   stroke doesn't show up as facets once it's outlined. */
function smoothPts(pts){
  if(pts.length < 4) return pts;
  const out = [pts[0]];
  for(let i=1; i<pts.length-1; i++){
    const a=pts[i-1], b=pts[i], c=pts[i+1];
    out.push({ x:(a.x+b.x*2+c.x)/4, y:(a.y+b.y*2+c.y)/4, p:(a.p+b.p*2+c.p)/4 });
  }
  out.push(pts[pts.length-1]);
  return out;
}

/* A pressure-varying stroke can't be one stroked <path>: stroke-width is a
   single number for the whole path. So the pen draws a FILLED outline —
   walk the centre line offsetting left and right by the local half-width,
   then come back down the other side, with arcs for round ends. With a mouse
   (flat pressure) this matches a constant-width stroke; a stylus tapers. */
function strokeOutlineD(pts, ox, oy, baseW){
  if(!pts.length) return "";
  const half = (p)=> Math.max(0.35, baseW * (0.42 + (p==null?0.5:p) * 1.16) / 2);
  if(pts.length === 1){
    const r = half(pts[0].p), x = pts[0].x-ox, y = pts[0].y-oy;
    return `M${x-r},${y} a${r},${r} 0 1,0 ${r*2},0 a${r},${r} 0 1,0 ${-r*2},0`;
  }
  const L = [], R = [];
  for(let i=0; i<pts.length; i++){
    const prev = pts[i-1] || pts[i];
    const next = pts[i+1] || pts[i];
    let dx = next.x-prev.x, dy = next.y-prev.y;
    const len = Math.hypot(dx,dy) || 1;
    dx/=len; dy/=len;
    const w = half(pts[i].p);
    const nx = -dy*w, ny = dx*w;
    L.push([pts[i].x-ox+nx, pts[i].y-oy+ny]);
    R.push([pts[i].x-ox-nx, pts[i].y-oy-ny]);
  }
  const n2 = (a)=> `${a[0].toFixed(2)},${a[1].toFixed(2)}`;
  const rEnd = half(pts[pts.length-1].p), rStart = half(pts[0].p);
  let d = `M${n2(L[0])}`;
  for(let i=1; i<L.length; i++) d += ` L${n2(L[i])}`;
  d += ` A${rEnd.toFixed(2)},${rEnd.toFixed(2)} 0 0 0 ${n2(R[R.length-1])}`;
  for(let i=R.length-2; i>=0; i--) d += ` L${n2(R[i])}`;
  d += ` A${rStart.toFixed(2)},${rStart.toFixed(2)} 0 0 0 ${n2(L[0])} Z`;
  return d;
}

/* ---- turning a drag into runs ---- */

const SAMPLE_STEP = 3.5;   // world px between generated points on a shape

function densify(a, b, out){
  const dist = Math.hypot(b.x-a.x, b.y-a.y);
  const steps = Math.max(1, Math.ceil(dist / SAMPLE_STEP));
  for(let i=1; i<=steps; i++){
    const t = i/steps;
    out.push({ x:a.x + (b.x-a.x)*t, y:a.y + (b.y-a.y)*t, p:0.5 });
  }
}
function polyRun(corners, closed){
  const pts = [{x:corners[0].x, y:corners[0].y, p:0.5}];
  for(let i=1; i<corners.length; i++) densify(corners[i-1], corners[i], pts);
  if(closed) densify(corners[corners.length-1], corners[0], pts);
  return { pts, closed:!!closed };
}

/* Shapes become sampled outlines so the eraser has something to cut.
   A rectangle is a closed run; an arrow is three (shaft plus two barbs). */
function shapeRuns(mode, a, b){
  if(mode === "line") return [polyRun([a,b], false)];
  if(mode === "rect"){
    const l=Math.min(a.x,b.x), r=Math.max(a.x,b.x), t=Math.min(a.y,b.y), bo=Math.max(a.y,b.y);
    return [polyRun([{x:l,y:t},{x:r,y:t},{x:r,y:bo},{x:l,y:bo}], true)];
  }
  if(mode === "ellipse"){
    const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
    const rx=Math.max(0.5,Math.abs(b.x-a.x)/2), ry=Math.max(0.5,Math.abs(b.y-a.y)/2);
    const n = Math.max(48, Math.round((rx+ry) * 1.2));
    const pts = [];
    for(let i=0; i<n; i++){
      const th = (i/n) * Math.PI*2;
      pts.push({ x:cx + Math.cos(th)*rx, y:cy + Math.sin(th)*ry, p:0.5 });
    }
    pts.push({...pts[0]});
    return [{ pts, closed:true }];
  }
  if(mode === "arrow"){
    const ang = Math.atan2(b.y-a.y, b.x-a.x);
    const len = Math.max(9, Math.min(30, Math.hypot(b.x-a.x, b.y-a.y) * 0.26));
    const a1 = ang + Math.PI*0.83, a2 = ang - Math.PI*0.83;
    return [
      polyRun([a,b], false),
      polyRun([b, {x:b.x+Math.cos(a1)*len, y:b.y+Math.sin(a1)*len}], false),
      polyRun([b, {x:b.x+Math.cos(a2)*len, y:b.y+Math.sin(a2)*len}], false)
    ];
  }
  return [];
}

/* ---- runs -> path string ---- */
function runsToPath(runs, filled, strokeWidth, ox, oy){
  if(!runs || !runs.length) return "";
  const parts = [];
  runs.forEach(run=>{
    const pts = run.pts;
    if(!pts || pts.length < 2) return;
    if(filled){
      parts.push(strokeOutlineD(smoothPts(pts), ox, oy, strokeWidth));
    } else {
      let d = `M${(pts[0].x-ox).toFixed(2)},${(pts[0].y-oy).toFixed(2)}`;
      for(let i=1; i<pts.length; i++) d += ` L${(pts[i].x-ox).toFixed(2)},${(pts[i].y-oy).toFixed(2)}`;
      if(run.closed) d += " Z";
      parts.push(d);
    }
  });
  return parts.join(" ");
}
function runsBBox(runs){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  runs.forEach(r=> r.pts.forEach(p=>{
    minX=Math.min(minX,p.x); minY=Math.min(minY,p.y);
    maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y);
  }));
  if(!isFinite(minX)) return null;
  return {minX, minY, maxX, maxY};
}

/* ---- shift constraints while drawing ---- */
/* 8 compass directions: the four axes plus the four diagonals between them */
function snapAngle(a, b){
  const dx = b.x-a.x, dy = b.y-a.y;
  const dist = Math.hypot(dx,dy);
  const step = Math.PI/4;
  const ang = Math.round(Math.atan2(dy,dx)/step) * step;
  return { x:a.x + Math.cos(ang)*dist, y:a.y + Math.sin(ang)*dist, p:b.p };
}
/* a square / a circle: the larger drag axis wins, so the shape follows
   the cursor rather than collapsing onto the smaller one */
function squareOff(a, b){
  const dx = b.x-a.x, dy = b.y-a.y;
  const m = Math.max(Math.abs(dx), Math.abs(dy));
  return { x:a.x + Math.sign(dx||1)*m, y:a.y + Math.sign(dy||1)*m, p:b.p };
}
function constrainEnd(mode, a, b, shift){
  if(!shift) return b;
  if(mode === "rect" || mode === "ellipse") return squareOff(a, b);
  return snapAngle(a, b);   // pen, line, arrow
}

function sketchIsFilled(){ return sketchMode === "pen"; }

/* the runs for the gesture in progress, in world coordinates */
function currentRuns(){
  if(!sketchPoints.length) return [];
  if(sketchMode === "pen" && !sketchShift){
    return [{ pts: sketchPoints, closed:false }];
  }
  const a = sketchPoints[0];
  const b = constrainEnd(sketchMode, a, sketchPoints[sketchPoints.length-1] || a, sketchShift);
  if(sketchMode === "pen") return [polyRun([a,b], false)];
  return shapeRuns(sketchMode, a, b);
}

let sketchPreviewNode = null;
let sketchRelease = null;
function beginSketchPreview(){
  sketchPreviewNode = document.createElementNS("http://www.w3.org/2000/svg","path");
  const filled = sketchIsFilled();
  sketchPreviewNode.setAttribute("fill", filled ? sketchColor : "none");
  sketchPreviewNode.setAttribute("stroke", filled ? "none" : sketchColor);
  if(!filled) sketchPreviewNode.setAttribute("stroke-width", sketchWidth);
  sketchPreviewNode.setAttribute("stroke-linecap","round");
  sketchPreviewNode.setAttribute("stroke-linejoin","round");
  // drawn into the overlay layer, which sits above every element —
  // the stroke no longer appears behind an image and then jumps in front
  sketchOverlay.appendChild(sketchPreviewNode);
  updateSketchPreview();
}
function updateSketchPreview(){
  if(!sketchPreviewNode) return;
  sketchPreviewNode.setAttribute("d", runsToPath(currentRuns(), sketchIsFilled(), sketchWidth, -4500, -4500));
}
function finalizeSketch(){
  if(sketchPreviewNode){ sketchPreviewNode.remove(); sketchPreviewNode=null; }
  const filled = sketchIsFilled();
  const mode = sketchMode;
  const runs = currentRuns();
  const pts = sketchPoints;
  sketchPoints = [];
  if(!runs.length || pts.length < 2) return;
  if(mode !== "pen" || sketchShift){
    const a = pts[0], b = pts[pts.length-1];
    if(Math.hypot(b.x-a.x, b.y-a.y) < 4) return;   // an accidental click, not a shape
  }
  const bb = runsBBox(runs);
  if(!bb) return;
  const pad = sketchWidth + 12;
  const x = bb.minX-pad, y = bb.minY-pad;
  const w = Math.max(30, (bb.maxX+pad)-x), h = Math.max(30, (bb.maxY+pad)-y);
  // re-home the runs into the element's own coordinate space
  const local = runs.map(r=>({ closed:r.closed, pts:r.pts.map(p=>({x:p.x-x, y:p.y-y, p:p.p})) }));
  const d = runsToPath(local, filled, sketchWidth, 0, 0);
  if(!d) return;
  addElementData({
    id:uid(), type:"sketch", x, y, w, h, vw:w, vh:h,
    runs: local, path:d, color:sketchColor, strokeWidth:sketchWidth,
    filled, shape: filled ? "pen" : mode
  });
}

/* ============================================================
   Eraser
   Cuts geometry rather than deleting elements: every point inside the
   brush is dropped and whatever survives is split into separate runs,
   which is what leaves a real gap in the middle of a stroke.
=============================================================*/
function eraserRadius(){ return Math.max(7, sketchWidth * 1.4); }

function eraseAtWorld(wx, wy, radius){
  const p = currentProject();
  for(let i = p.elements.length-1; i >= 0; i--){
    const d = p.elements[i];
    if(d.type !== "sketch" || d.locked) continue;
    if(wx < d.x-radius || wx > d.x+d.w+radius || wy < d.y-radius || wy > d.y+d.h+radius) continue;
    // a sketch saved before runs existed has no geometry to cut, so the
    // old whole-stroke behaviour is the only option for it
    if(!d.runs || !d.runs.length){
      removeElementData(d.id, true);
      erasedAny = true;
      continue;
    }
    const vw = d.vw || d.w, vh = d.vh || d.h;
    const sx = vw / (d.w || vw), sy = vh / (d.h || vh);
    const lx = (wx - d.x) * sx, ly = (wy - d.y) * sy;
    const rx = radius * sx, ry = radius * sy;
    if(cutRuns(d, lx, ly, rx, ry)){ erasedAny = true; erasedIds.add(d.id); }
  }
}

/* After a cut the element box still spans where the stroke used to be, so the
   selection outline floats around empty space. Re-home the surviving runs and
   shrink the box to match — done once when the gesture ends, not per sample. */
function trimSketch(id){
  const d = getElData(id);
  if(!d || !d.runs || !d.runs.length) return;
  const bb = runsBBox(d.runs);
  if(!bb) return;
  const vw = d.vw || d.w, vh = d.vh || d.h;
  const scaleX = (d.w || vw) / vw, scaleY = (d.h || vh) / vh;
  const pad = (d.strokeWidth || 3) + 6;
  const bx = bb.minX - pad, by = bb.minY - pad;
  const bw = Math.max(12, (bb.maxX + pad) - bx), bh = Math.max(12, (bb.maxY + pad) - by);
  if(bx <= 0.5 && by <= 0.5 && bw >= vw-1 && bh >= vh-1) return;   // nothing to gain
  d.runs = d.runs.map(r=>({ closed:r.closed, pts:r.pts.map(p=>({x:p.x-bx, y:p.y-by, p:p.p})) }));
  d.x += bx * scaleX;
  d.y += by * scaleY;
  d.w = bw * scaleX;
  d.h = bh * scaleY;
  d.vw = bw; d.vh = bh;
  d.path = runsToPath(d.runs, d.filled, d.strokeWidth || 3, 0, 0);
  const node = document.getElementById(id);
  if(node){
    applyElRect(id, d);
    const svg = node.querySelector(".el-frame > svg");
    if(svg) svg.setAttribute("viewBox", `0 0 ${bw} ${bh}`);
    const pathEl = svg && svg.querySelector("path");
    if(pathEl) pathEl.setAttribute("d", d.path);
  }
}

function cutRuns(d, lx, ly, rx, ry){
  const inside = (pt)=>{
    const ax = (pt.x-lx)/rx, ay = (pt.y-ly)/ry;
    return ax*ax + ay*ay <= 1;
  };
  let touched = false;
  const out = [];
  d.runs.forEach(run=>{
    const pts = run.pts;
    if(!pts.length) return;
    const hit = pts.map(inside);
    if(!hit.some(Boolean)){ out.push(run); return; }
    touched = true;
    // a closed run that loses a piece is no longer closed: rotate it so the
    // cut falls at the ends, then treat it as an open run
    let seq = pts, seqHit = hit;
    if(run.closed){
      let start = seqHit.indexOf(true);
      seq = pts.slice(start).concat(pts.slice(0, start));
      seqHit = hit.slice(start).concat(hit.slice(0, start));
    }
    let cur = [];
    for(let i=0; i<seq.length; i++){
      if(seqHit[i]){
        if(cur.length >= 2) out.push({pts:cur, closed:false});
        cur = [];
      } else cur.push(seq[i]);
    }
    if(cur.length >= 2) out.push({pts:cur, closed:false});
  });
  if(!touched) return false;
  if(!out.length){
    removeElementData(d.id, true);
    return true;
  }
  d.runs = out;
  d.path = runsToPath(out, d.filled, d.strokeWidth || 3, 0, 0);
  const node = document.getElementById(d.id);
  const pathEl = node && node.querySelector(".el-frame > svg > path");
  if(pathEl) pathEl.setAttribute("d", d.path);
  return true;
}

/* ---- two-finger pinch zoom + pan ---- */
function abortForPinch(){
  if(panning){ panning = false; stage.classList.remove("panning"); }
  if(marqueeActive){ marqueeActive = false; marquee.style.display = "none"; }
  cancelTextDraw();
  if(sketchActive){
    sketchActive = false;
    if(sketchRelease){ sketchRelease(); sketchRelease = null; }
    endGesture();
    if(sketchPreviewNode){ sketchPreviewNode.remove(); sketchPreviewNode = null; }
    sketchPoints = [];
  }
  if(eraseActive) endSketchGesture();
}
// capture phase, so the second finger never reaches an element or the stage's own handler
stage.addEventListener("pointerdown",(e)=>{
  if(e.pointerType !== "touch") return;
  touchPts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(touchPts.size < 2) return;
  e.stopImmediatePropagation();
  e.preventDefault();
  if(!pinch){
    abortForPinch();
    const [a,b] = Array.from(touchPts.values());
    pinch = { d:Math.max(1, Math.hypot(a.x-b.x, a.y-b.y)), cx:(a.x+b.x)/2, cy:(a.y+b.y)/2 };
  }
}, true);
window.addEventListener("pointermove",(e)=>{
  if(e.pointerType !== "touch" || !touchPts.has(e.pointerId)) return;
  touchPts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(!pinch || touchPts.size < 2) return;
  const [a,b] = Array.from(touchPts.values());
  const d = Math.max(1, Math.hypot(a.x-b.x, a.y-b.y));
  const cx = (a.x+b.x)/2, cy = (a.y+b.y)/2;
  const r = stage.getBoundingClientRect();
  // the world point that was under the old midpoint stays under the new one
  const wx = (pinch.cx - r.left - camera.x) / camera.scale;
  const wy = (pinch.cy - r.top - camera.y) / camera.scale;
  const ns = Math.min(2.5, Math.max(0.15, camera.scale * d / pinch.d));
  camera.scale = ns;
  camera.x = (cx - r.left) - wx*ns;
  camera.y = (cy - r.top) - wy*ns;
  pinch.d = d; pinch.cx = cx; pinch.cy = cy;
  applyCamera();
});
function touchEnd(e){
  if(e.pointerType !== "touch") return;
  touchPts.delete(e.pointerId);
  if(pinch && touchPts.size < 2){ pinch = null; saveCamera(); }
}
window.addEventListener("pointerup", touchEnd);
window.addEventListener("pointercancel", touchEnd);

stage.addEventListener("wheel",(e)=>{
  e.preventDefault();
  if(e.ctrlKey || e.metaKey){
    const factor = Math.exp(-e.deltaY * 0.0018);
    zoomAt(e.clientX, e.clientY, factor);
  } else {
    camera.x -= e.deltaX;
    camera.y -= e.deltaY;
    applyCamera();
    saveCamera();
  }
},{passive:false});

window.addEventListener("keydown",(e)=>{
  const meta = e.metaKey || e.ctrlKey;
  if(meta && e.key.toLowerCase()==="z"){
    e.preventDefault();
    if(e.shiftKey) redo(); else undo();
    return;
  }
  if(meta && e.key.toLowerCase()==="y"){
    e.preventDefault();
    redo();
    return;
  }
  if(meta && e.key.toLowerCase()==="d" && selection.size && !isBusy()){
    e.preventDefault();
    Array.from(selection).forEach(duplicateElement);
    return;
  }
  const ae = document.activeElement;
  if(ae && (ae.isContentEditable || ae.tagName==="INPUT" || ae.tagName==="TEXTAREA")) {
    if(e.code==="Space") return;
    if(e.key==="Escape") ae.blur();
    return;
  }

  // Escape always gets through: it backs out of a crop / annotate session
  if(e.key==="Escape"){
    if(textDrawActive){ cancelTextDraw(); setTool("select"); return; }
    if(els(".adjust-pop").length){ closePopovers(); return; }
    if(cancelActiveTool()) return;
    if(tool !== "select"){ setTool("select"); return; }
    clearSelection(); connectFrom=null;
    return;
  }

  /* --------------------------------------------------------------
     Everything below is a bare single-key shortcut. They are gated
     hard, because the loose version of this block is what produced
     stray text boxes in the middle of a crop or a resize:
       - not while a pointer gesture is running
       - not while a crop / annotate overlay is open
       - not with any modifier held (Ctrl+T, Alt+S, ... are the
         browser's, not ours)
       - not on auto-repeat
       - not when the key came from a focused button
  ---------------------------------------------------------------*/
  if(isBusy()) return;
  if(e.repeat) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  // Enter would re-fire a focused button; Space must NOT be blocked here,
  // because Space is pan and the last thing clicked is often a toolbar button
  if(ae && (ae.tagName==="BUTTON" || ae.tagName==="A" || ae.tagName==="SELECT") && e.key==="Enter") return;

  if(e.code==="Space"){
    // preventDefault stops the focused button from activating
    e.preventDefault();
    if(ae && ae !== document.body && ae.blur) ae.blur();
    spaceHeld=true; stage.classList.add("pan-ready");
    return;
  }
  if(e.key==="Delete" || e.key==="Backspace"){
    if(selection.size){
      // one history entry for the whole deletion, not one per element.
      // (Passing removeElementData straight to forEach also handed it the
      // array index as its second argument, which now means "silent".)
      const pre = snapshotState();
      Array.from(selection).forEach(id=> removeElementData(id, true));
      commitHistory(pre);
      e.preventDefault();
    }
    return;
  }
  const k = e.key.length === 1 ? e.key.toLowerCase() : "";
  if(k==="v"){ setTool("select"); return; }
  if(k==="s"){ setTool("sketch"); return; }
  if(k==="c"){ setTool("connect"); return; }
  if(k==="g"){ beginInsert(); addSectionElement(); return; }
  if(e.key === "F2" && selection.size === 1){
    const n = document.getElementById(Array.from(selection)[0]);
    if(n && n.__renameSection){ e.preventDefault(); n.__renameSection(); return; }
  }
  // T arms the text tool: click for a default box, or drag one the size you want
  if(k==="t"){ setTool("text"); return; }
  // fit everything back into view — the way out of being lost on the canvas
  if(k==="f" || e.key==="Home"){ fitToScreen(); return; }
});
window.addEventListener("keyup",(e)=>{
  if(e.code==="Space"){ spaceHeld=false; stage.classList.remove("pan-ready"); }
});

stage.addEventListener("click",(e)=>{

  }
});

/* ============================================================
   Tool switching
=============================================================*/
function setTool(t){
  // leaving a tool has to actually put it away: switching to text from the
  // eraser used to leave the eraser live underneath
  cancelTextDraw();
  endSketchGesture();
  tool = t;
  connectFrom = null;
  closePopovers();
  cancelActiveTool();
  hideEraserRing();
  stage.classList.remove("section-move");
  els(".tb-btn[data-tool]").forEach(b=> b.classList.toggle("active", b.dataset.tool===t));
  stage.classList.toggle("connect-mode", t==="connect");
  stage.classList.toggle("text-mode", t==="text");
  // lets CSS keep the YouTube shields up so you can draw / connect across an embed
  document.body.classList.toggle("tool-sketch", t==="sketch");
  document.body.classList.toggle("tool-connect", t==="connect");
  sketchPanelEl.classList.toggle("hidden", t!=="sketch");
  syncSketchMode();
  if(t!=="select") clearSelection();
}
els(".tb-btn[data-tool]").forEach(b=> b.addEventListener("click",()=> setTool(b.dataset.tool)));
el("#undo-btn").addEventListener("click", undo);
el("#redo-btn").addEventListener("click", redo);

   Toolbar actions
=============================================================*/
/* Every "add something" action drops back to the select tool first. Adding a
   note while the eraser was up used to leave the eraser running underneath. */
function beginInsert(){
  if(tool !== "select") setTool("select");
  cancelActiveTool();
}

function offsetPos(i){ const c = centerViewWorld(); return {x:c.x+i*24, y:c.y+i*24}; }

el("#zoom-in").addEventListener("click",()=>{ const r=stage.getBoundingClientRect(); zoomAt(r.left+r.width/2, r.top+r.height/2, 1.2); });

el("#zoom-fit").addEventListener("click",()=> fitToScreen());
// click the percentage to snap back to actual size
zoomPct.title = "Reset to 100%";
zoomPct.addEventListener("click",()=> resetZoomToActualSize(true));
function fitToScreen(){
  const p = currentProject();
  if(!p.elements.length){ camera={x:0,y:0,scale:1}; applyCamera(); saveCamera(); return; }
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  p.elements.forEach(d=>{ minX=Math.min(minX,d.x); minY=Math.min(minY,d.y); maxX=Math.max(maxX,d.x+d.w); maxY=Math.max(maxY,d.y+d.h); });
  const r = stage.getBoundingClientRect();
  const pad=80;
  const scale = Math.min(1.4, Math.min((r.width-pad*2)/(maxX-minX), (r.height-pad*2)/(maxY-minY)));
  camera.scale = Math.max(0.15, scale);
  camera.x = r.width/2 - ((minX+maxX)/2)*camera.scale;
  camera.y = r.height/2 - ((minY+maxY)/2)*camera.scale;
  applyCamera();
  saveCamera();
}

/* ============================================================
   Off-screen wayfinding
   Edge arrows that point at anything currently outside the
   viewport, so a far-flung note is never lost. Click one to fly
   to it. Nearby arrows merge into a single counted marker.
=============================================================*/
const markersLayer = el("#offscreen-markers");
const lostChip = el("#lost-chip");

// keeps arrows clear of the title row, the rescue chip, the toolbar and the zoom pill
const OM_INSET = { top:112, right:46, bottom:96, left:34 };
const OM_CLUSTER_DIST = 46;   // px along the edge before two markers merge
const OM_MAX = 9;

const OM_ICONS = {
  text:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 6h14M12 6v13"/></svg>',
  image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.4"/><path d="M20 15l-4.5-4.5-8 8"/></svg>',
  youtube:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="3"/><path d="M10 9.6l5 2.4-5 2.4V9.6z" fill="currentColor" stroke="none"/></svg>',
  video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="M15.5 10.5l5-3v9l-5-3z"/></svg>',
  sketch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.4-4.6L16 4.8a1.9 1.9 0 0 1 2.7 0l.6.6a1.9 1.9 0 0 1 0 2.7L7.6 19.6 3 21z"/></svg>',
  palette:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M9 6v12M15 6v12"/></svg>',
  audio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9.5" y="3" width="5" height="9.5" rx="2.5"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg>',
  section:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="6.5" width="17" height="12" rx="2" stroke-dasharray="3.2 2.4"/></svg>',
  stack:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>'
};
// a solid arrowhead reads far better than a thin chevron at this size
const OM_ARROW = '<svg viewBox="0 0 12 12"><path d="M1.6 1.1L10.6 6 1.6 10.9 3.4 6z" fill="currentColor"/></svg>';

function elLabel(d){
  if(d.type === "text"){
    const t = (d.text||"").trim().replace(/\s+/g," ");
    return t ? (t.length>30 ? t.slice(0,30)+"…" : t) : "Empty note";
  }
  if(d.type === "section") return d.title || "Section";
  if(d.type === "audio") return d.label || "Voice note";
  return { image:"Image", youtube:"YouTube video", video:"Video", sketch:"Sketch", palette:"Colour palette" }[d.type] || "Item";
}

/* where a ray from the viewport centre leaves the inset rectangle */
function edgeHit(cx, cy, tx, ty, box){
  const dx = tx-cx, dy = ty-cy;
  let best = Infinity;
  if(dx > 0) best = Math.min(best, (box.r-cx)/dx);
  if(dx < 0) best = Math.min(best, (box.l-cx)/dx);
  if(dy > 0) best = Math.min(best, (box.b-cy)/dy);
  if(dy < 0) best = Math.min(best, (box.t-cy)/dy);
  if(!isFinite(best) || best < 0) best = 0;
  return {
    x: Math.max(box.l, Math.min(box.r, cx + dx*best)),
    y: Math.max(box.t, Math.min(box.b, cy + dy*best))
  };
}

let markersDirty = true, markersQueued = false;
function scheduleMarkers(){
  markersDirty = true;
  if(markersQueued) return;
  markersQueued = true;
  requestAnimationFrame(()=>{
    markersQueued = false;
    syncToolbarFlip();
    if(markersDirty) renderOffscreenMarkers();
  });
}

function renderOffscreenMarkers(){
  markersDirty = false;
  const p = currentProject();
  markersLayer.innerHTML = "";
  if(!p || !p.elements || !p.elements.length){ lostChip.classList.remove("show"); return; }

  const r = stage.getBoundingClientRect();
  const vw = r.width, vh = r.height;
  // on a phone the zoom column sits on the right edge and the toolbar is shorter
  const small = vw < 721;
  const box = { l:OM_INSET.left, t:OM_INSET.top, r:vw-(small?74:OM_INSET.right), b:vh-(small?84:OM_INSET.bottom) };
  if(box.r <= box.l || box.b <= box.t){ lostChip.classList.remove("show"); return; }
  const vcx = vw/2, vcy = vh/2;

  // which elements are outside the viewport?
  const off = [];
  let onScreen = 0, considered = 0;
  p.elements.forEach(d=>{
    // while a tag filter is on, the arrows point only at what it shows
    if(tagFilter.size && !(d.tag && tagFilter.has(d.tag))) return;
    considered++;
    const x = d.x*camera.scale + camera.x;
    const y = d.y*camera.scale + camera.y;
    const w = d.w*camera.scale, h = d.h*camera.scale;
    const visible = (x < vw && x+w > 0 && y < vh && y+h > 0);
    if(visible){ onScreen++; return; }
    const tx = x + w/2, ty = y + h/2;
    off.push({ d, tx, ty, dist: Math.hypot(tx-vcx, ty-vcy) });
  });

  if(!off.length){ lostChip.classList.remove("show"); return; }

  // nearest first, so a merged marker is represented by its closest member
  off.sort((a,b)=> a.dist-b.dist);

  const clusters = [];
  off.forEach(item=>{
    const hit = edgeHit(vcx, vcy, item.tx, item.ty, box);
    const near = clusters.find(c=> Math.hypot(c.x-hit.x, c.y-hit.y) < OM_CLUSTER_DIST);
    if(near){ near.items.push(item); return; }
    clusters.push({ x:hit.x, y:hit.y, items:[item],
                    angle: Math.atan2(item.ty-vcy, item.tx-vcx) * 180/Math.PI });
  });

  clusters.slice(0, OM_MAX).forEach(c=>{
    const lead = c.items[0];
    const many = c.items.length > 1;
    const node = document.createElement("div");
    node.className = "om";
    node.style.left = c.x+"px";
    node.style.top  = c.y+"px";

    // which edge it landed on — drives where the hover label sits
    const pad = 2;
    if(c.x <= box.l+pad) node.classList.add("side-l");
    else if(c.x >= box.r-pad) node.classList.add("side-r");
    else if(c.y <= box.t+pad) node.classList.add("side-t");
    else node.classList.add("side-b");

    const badge = document.createElement("div");
    badge.className = "om-badge";
    badge.innerHTML = many ? OM_ICONS.stack : (OM_ICONS[lead.d.type] || OM_ICONS.stack);
    node.appendChild(badge);

    const ptr = document.createElement("div");
    ptr.className = "om-ptr";
    ptr.innerHTML = OM_ARROW;
    ptr.style.transform = `rotate(${c.angle}deg) translateX(23px)`;
    node.appendChild(ptr);

    if(many){
      const cnt = document.createElement("span");
      cnt.className = "om-count";
      cnt.textContent = c.items.length > 99 ? "99+" : c.items.length;
      // park the count in the corner opposite the arrowhead so they never overlap
      const rad = c.angle*Math.PI/180;
      const pointsRight = Math.cos(rad) > 0, pointsDown = Math.sin(rad) > 0;
      cnt.style.left   = pointsRight ? "-6px" : "auto";
      cnt.style.right  = pointsRight ? "auto" : "-6px";
      cnt.style.top    = pointsDown  ? "-6px" : "auto";
      cnt.style.bottom = pointsDown  ? "auto" : "-6px";
      node.appendChild(cnt);
    }

    const label = document.createElement("span");
    label.className = "om-label";
    label.textContent = many ? (c.items.length + " items this way") : elLabel(lead.d);
    node.appendChild(label);

    node.title = many ? "Fly to these " + c.items.length + " items" : "Fly to: " + elLabel(lead.d);
    node.addEventListener("pointerdown", e=> e.stopPropagation());
    node.addEventListener("click",(e)=>{
      e.stopPropagation();
      if(many){
        flyToRect(rectOfMany(c.items.map(i=>i.d)));
      } else {
        const d = lead.d;
        flyToRect({x:d.x, y:d.y, w:d.w, h:d.h}, ()=>{
          if(tool === "select") selectOnly(d.id);
        });
      }
    });

    markersLayer.appendChild(node);
  });

  // everything is off-screen: offer a way straight back
  const lostText = el(".lost-text", lostChip);
  if(onScreen === 0){
    lostText.textContent = considered === 1
      ? "Your one item is off-screen"
      : "All " + considered + " items are off-screen";
    lostChip.classList.add("show");
  } else {
    lostChip.classList.remove("show");
  }
}

function rectOfMany(list){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  list.forEach(d=>{
    minX=Math.min(minX,d.x); minY=Math.min(minY,d.y);
    maxX=Math.max(maxX,d.x+d.w); maxY=Math.max(maxY,d.y+d.h);
  });
  return {x:minX, y:minY, w:maxX-minX, h:maxY-minY};
}

let cameraAnim = null;
function animateCamera(target, done){
  if(cameraAnim) cancelAnimationFrame(cameraAnim);
  const from = {...camera};
  const t0 = performance.now(), dur = 420;
  function step(now){
    const k = Math.min(1, (now-t0)/dur);
    const e = 1 - Math.pow(1-k, 3);          // easeOutCubic
    camera.x = from.x + (target.x-from.x)*e;
    camera.y = from.y + (target.y-from.y)*e;
    camera.scale = from.scale + (target.scale-from.scale)*e;
    applyCamera();
    if(k < 1){ cameraAnim = requestAnimationFrame(step); }
    else { cameraAnim = null; saveCamera(); if(done) done(); }
  }
  cameraAnim = requestAnimationFrame(step);
}

/* centre a world-space rect in the viewport, zooming out only if it won't fit */
function flyToRect(rect, done){
  const r = stage.getBoundingClientRect();
  const pad = 140;
  let ns = camera.scale;
  const fit = Math.min((r.width-pad)/Math.max(1,rect.w), (r.height-pad)/Math.max(1,rect.h));
  if(fit < ns) ns = Math.max(0.15, fit);
  const cx = rect.x + rect.w/2, cy = rect.y + rect.h/2;
  animateCamera({ scale:ns, x:r.width/2 - cx*ns, y:r.height/2 - cy*ns }, done);
}

el("#lost-btn").addEventListener("click",(e)=>{
  e.stopPropagation();
  if(tagFilter.size) flyToTagged(); else fitToScreen();
});

/* ============================================================
   Drag & drop files / links onto canvas
=============================================================*/
stage.addEventListener("dragover",(e)=> e.preventDefault());
stage.addEventListener("drop",(e)=>{
  e.preventDefault();
  const pos = screenToWorld(e.clientX, e.clientY);
  const files = Array.from(e.dataTransfer.files||[]);
  if(files.length){
    files.forEach((f,i)=> addMediaFile(f, {x:pos.x+i*20, y:pos.y+i*20}));
    return;
  }
  const html = e.dataTransfer.getData("text/html");
  const text = e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text/plain");
  // an image dragged straight from another tab used to land as a text box
  // containing its URL
  const imgUrl = imageUrlFrom(html, text);
  if(imgUrl){ addImageFromUrl(imgUrl, pos); return; }
  if(text){
    if(/youtube\.com|youtu\.be/.test(text)) addYoutubeFromUrl(text.trim(), pos);
    else addTextAt(text, pos);
  }
});
/* Chrome and Firefox both put an <img> tag in text/html when you drag an
   image out of a page; Safari only gives the URL. Handle both. */
function imageUrlFrom(html, text){
  if(html){
    const m = /<img[^>]+src\s*=\s*["\']([^"\']+)["\']/i.exec(html);
    if(m && /^https?:\/\//i.test(m[1])) return m[1];
  }
  const t = (text||"").trim();
  if(/^https?:\/\//i.test(t) && /\.(png|jpe?g|gif|webp|avif|bmp|svg)(\?|#|$)/i.test(t)) return t;
  return null;
}
function addImageFromUrl(url, worldPos){
  const pos = worldPos || centerViewWorld();
  const probe = new Image();
  probe.onload = ()=>{
    const maxDim = 380;
    let w = probe.naturalWidth || 320, h = probe.naturalHeight || 240;
    const scale = Math.min(1, maxDim/Math.max(w,h));
    w*=scale; h*=scale;
    const data = { id:uid(), type:"image", x:pos.x-w/2, y:pos.y-h/2, w, h, src:url };
    addElementData(data);
    selectOnly(data.id);
    // Best effort: pull the bytes down so the reference survives the source
    // going away, and so crop / flip / palette work on it. Cross-origin rules
    // will often refuse, which is why the element renders from the URL first.
    fetch(url).then(r=> r.ok ? r.blob() : null).then(b=>{
      if(!b || !/^image\//.test(b.type)) return;
      const d = getElData(data.id);
      if(!d) return;
      d.blob = b; d.src = null;
      const n = document.getElementById(data.id);
      if(n && n.__imgEl){
        releaseObjectUrls(data.id);
        n.__imgEl.src = makeObjectUrl(data.id, b);
      }
      scheduleSave();
    }).catch(()=>{});
  };
  probe.onerror = ()=>{
    addTextAt(url, pos);
    showToast("That image wouldn't load, so I kept the link");
  };
  probe.src = url;
}
function addTextAt(text, pos){
  const data = { id:uid(), type:"text", x:pos.x-100, y:pos.y-20, w:220, h:60, fontSize:18, text:text, color:null, bg:null };
  addElementData(data);
  selectOnly(data.id);
}

/* ============================================================
   Paste handling
=============================================================*/
let lastMouseWorld = {x:0,y:0};
let lastMouseValid = false;
stage.addEventListener("pointermove",(e)=>{
  lastMouseWorld = screenToWorld(e.clientX,e.clientY);
  lastMouseValid = true;
  lastPointerScreen = {x:e.clientX, y:e.clientY};
  if(tool === "sketch" && sketchMode === "erase") showEraserRing(e.clientX, e.clientY);
  // show a move cursor over the empty inside of a selected section, so the
  // large drag area is discoverable rather than hidden
  const overSection = tool === "select" && !spaceHeld && !panning && !marqueeActive
    && selection.size === 1
    && !e.target.closest(".el")
    && !!sectionAtPoint(lastMouseWorld.x, lastMouseWorld.y, true);
  stage.classList.toggle("section-move", overSection);
});
stage.addEventListener("pointerleave", hideEraserRing);

window.addEventListener("paste",(e)=>{
  if(isBusy()) return;
  if(document.activeElement && (document.activeElement.isContentEditable || document.activeElement.tagName==="INPUT")) return;
  const items = Array.from(e.clipboardData.items || []);
  let handledFile = false;
  items.forEach(item=>{
    if(item.kind !== "file") return;
    const file = item.getAsFile();
    if(file && mediaKind(file)){ addMediaFile(file, lastMouseWorld); handledFile = true; }
  });
  if(handledFile) return;
  const text = e.clipboardData.getData("text/plain");
  const imgUrl = imageUrlFrom(e.clipboardData.getData("text/html"), text);
  if(imgUrl){ addImageFromUrl(imgUrl, lastMouseWorld); return; }
  if(!text) return;
  if(/youtube\.com|youtu\.be/.test(text)){
    addYoutubeFromUrl(text.trim(), lastMouseWorld);
  } else {
    addTextAt(text, lastMouseWorld);
  }
});
